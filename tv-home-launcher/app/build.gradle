plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homescreen.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.homescreen.tv'
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName '3.13'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded: the debug key keeps release and debug builds installable over each other.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies: plain Android framework only, so the build needs nothing new from the network.
