<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#f2e1ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Komeeta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Komeeta — встречи с людьми рядом: планы на вечер, чаты, музыка и безопасные встречи." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Komeeta</title>
    <!-- Превью ссылки в мессенджерах и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Komeeta" />
    <meta property="og:title" content="Komeeta — встречи с людьми рядом" />
    <meta property="og:description" content="Планы на вечер, чаты, звонки, музыка и безопасные встречи." />
    <meta property="og:url" content="https://komeeta.com/" />
    <meta property="og:image" content="https://komeeta.com/og.jpg" />
    <meta property="og:image:secure_url" content="https://komeeta.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Komeeta — встречи с людьми рядом" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Komeeta — встречи с людьми рядом" />
    <meta name="twitter:description" content="Планы на вечер, чаты, звонки, музыка и безопасные встречи." />
    <meta name="twitter:image" content="https://komeeta.com/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Sora:wght@600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Если сайт не запустился (обычно — очень старый встроенный браузер Android WebView), через 10 секунд показываем, что делать -->
    <script>
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && r.children.length) return;
        var m = /Chrome\/(\d+)/.exec(navigator.userAgent), v = m ? +m[1] : 0;
        var app = /KomeetaApp/.test(navigator.userAgent);
        r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font:16px system-ui,sans-serif;text-align:center;color:#20121c">' +
          '<div style="max-width:340px"><div style="font-size:44px">🛠</div><h1 style="font-size:20px;margin:12px 0">Komeeta не запустилась</h1>' +
          '<p style="line-height:1.4;margin:0 0 16px">' + (app
            ? 'На телефоне устарел системный компонент <b>Android System WebView</b>' + (v ? ' (версия ' + v + ')' : '') + '. Откройте Google Play, найдите «Android System WebView» и нажмите <b>Обновить</b>, затем перезапустите Komeeta.'
            : 'Браузер устарел' + (v ? ' (версия ' + v + ')' : '') + '. Обновите его или откройте komeeta.com в Google Chrome.') + '</p>' +
          (app ? '<a href="https://play.google.com/store/apps/details?id=com.google.android.webview" style="display:inline-block;padding:12px 22px;border-radius:99px;background:#ff4f86;color:#fff;text-decoration:none;font-weight:600">Открыть в Google Play</a>' : '') +
          '</div></div>';
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
