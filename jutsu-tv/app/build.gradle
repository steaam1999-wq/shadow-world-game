plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jutsu.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jutsu.tv'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded for now: the debug key keeps release and debug builds installable over each other.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies: plain Android framework only, so the build needs nothing new from the network.
