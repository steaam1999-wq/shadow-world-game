<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Drop — кейсы и апгрейды CS2</title>
  <meta name="description" content="Симулятор открытия кейсов CS2: рулетка, апгрейды, контракты, батлы и Provably Fair. Виртуальные монеты, без реальных денег.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 10 16 4l12 6v12l-12 6-12-6z' fill='%23ff7a18'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/"><span class="logo-mark"></span>SHADOW<b>DROP</b></a>
    <nav class="nav">
      <a href="#/" data-nav="cases">Кейсы</a>
      <a href="#/upgrade" data-nav="upgrade">Апгрейд</a>
      <a href="#/contracts" data-nav="contracts">Контракты</a>
      <a href="#/battles" data-nav="battles">Батлы</a>
      <a href="#/skins" data-nav="skins">Скины</a>
      <a href="#/fair" data-nav="fair">Честная игра</a>
    </nav>
    <div class="user">
      <div class="level" id="level"></div>
      <div class="wallet"><span id="balance"></span><button class="plus" id="deposit" title="Демо-пополнение">+</button></div>
      <div class="account" id="account"></div>
      <a class="inv-btn" href="#/inventory" data-nav="inventory" title="Инвентарь">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM8 7V5a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span id="inv-count">0</span>
      </a>
    </div>
  </header>

  <div class="feed"><div class="feed-label"><i></i>LIVE</div><div class="feed-list" id="feed-list"></div></div>

  <main id="view" class="container"></main>

  <footer class="footer container">
    <p><b>Shadow Drop</b> — демонстрационный симулятор. Все монеты и предметы виртуальные: пополнение, покупка и вывод
      реальных скинов невозможны. Не связано с Valve Corporation. 18+.</p>
  </footer>

  <div id="toasts" class="toasts"></div>

  <script src="js/sha256.js"></script>
  <script src="js/cs2-db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reel.js"></script>
  <script src="js/pages/cases.js"></script>
  <script src="js/pages/upgrade.js"></script>
  <script src="js/pages/contracts.js"></script>
  <script src="js/pages/battles.js"></script>
  <script src="js/pages/inventory.js"></script>
  <script src="js/pages/skins.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
