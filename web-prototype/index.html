<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shadow World — прототип</title>
<style>
  :root {
    --bg: #120e1e; --bg2: #1b1530; --panel: #241d3d; --panel2: #2e2650; --accent: #8c5aff;
    --dis: #3d3654; --text: #f3efff; --muted: #a59bc3; --good: #4fd68a; --bad: #ef5470;
    --gold: #ffc94d; --gem: #5fe3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; color: var(--text); overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #241a44 0%, var(--bg) 60%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

  /* ---------- Верхняя панель ---------- */
  #top { display: grid; grid-template-columns: 58px 1fr 76px; align-items: center; gap: 8px; padding: 10px 12px 4px; }
  #lvl {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--accent) calc(var(--xp, 0) * 1%), #2c2446 0);
    box-shadow: 0 0 14px rgba(140, 90, 255, .45);
  }
  #lvl > div {
    width: 42px; height: 42px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center;
    font-weight: 900; font-size: 17px; line-height: 1;
  }
  #lvl small { display: block; font-size: 9px; color: var(--muted); font-weight: 700; }
  #mid { text-align: center; min-width: 0; }
  #ess { font-size: 25px; font-weight: 900; letter-spacing: .3px; white-space: nowrap; transition: transform .12s; }
  #ess.pop { transform: scale(1.08); }
  #info { font-size: 12px; color: var(--muted); margin-top: 2px; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gems {
    justify-self: end; background: var(--panel); border: 1.5px solid rgba(95, 227, 255, .45); border-radius: 12px;
    padding: 6px 8px; font-weight: 900; font-size: 15px; white-space: nowrap;
  }

  /* ---------- Зона ---------- */
  #zonebar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  #zonebar button {
    width: 40px; height: 36px; border-radius: 10px; border: 1.5px solid rgba(140, 90, 255, .5);
    background: var(--panel); color: var(--text); font-size: 16px; font-weight: 900;
  }
  #zonebar button:disabled { opacity: .3; }
  #zname { flex: 1; text-align: center; font-weight: 900; font-size: 16px; text-shadow: 0 0 12px currentColor; }
  #arenaWrap {
    flex: 1; position: relative; margin: 0 10px; border-radius: 18px; overflow: hidden; min-height: 200px;
    border: 1.5px solid rgba(140, 90, 255, .45); box-shadow: 0 0 24px rgba(140, 90, 255, .18), inset 0 0 40px rgba(0, 0, 0, .5);
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #gift {
    position: absolute; right: 10px; top: 10px; width: 46px; height: 46px; border-radius: 14px; border: 0;
    background: rgba(36, 29, 61, .85); font-size: 24px; display: grid; place-items: center;
    box-shadow: 0 0 0 1.5px rgba(255, 201, 77, .5);
  }
  #gift.ready { animation: pulse 1.2s infinite; box-shadow: 0 0 18px rgba(255, 201, 77, .8), 0 0 0 2px var(--gold); }
  #gift .dot, .navdot {
    position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bad); border: 2px solid var(--bg); display: none;
  }
  #gift.ready .dot { display: block; }
  #lock {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 20px; text-align: center; background: rgba(8, 6, 16, .72); font-weight: 700; backdrop-filter: blur(3px);
  }
  #lock .big { font-size: 44px; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 14px; font-weight: 700;
    color: rgba(243, 239, 255, .85); pointer-events: none; transition: opacity .6s; text-shadow: 0 1px 6px #000;
  }
  #banner {
    position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; opacity: 0;
    font-size: 26px; font-weight: 900; letter-spacing: 1px; color: #ff5a6e; text-shadow: 0 0 18px #ff2040, 0 2px 0 #000;
  }
  #banner.show { animation: banner 2.2s ease forwards; }

  /* ---------- Нижнее меню ---------- */
  #nav { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 8px 8px 14px; }
  #nav button {
    position: relative; background: linear-gradient(180deg, var(--panel2), var(--panel)); color: var(--text);
    border: 1.5px solid rgba(140, 90, 255, .45); border-radius: 12px; padding: 6px 0 5px; font-size: 10px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  #nav button span { font-size: 20px; }
  #nav button:active { transform: scale(.95); }

  /* ---------- Кнопки ---------- */
  .btn {
    background: linear-gradient(180deg, #a07aff, var(--accent)); color: #fff; border: 0; border-radius: 11px;
    font-weight: 900; font-size: 14px; padding: 10px 10px; min-width: 104px; white-space: nowrap;
    box-shadow: 0 3px 0 #5b36b8;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5b36b8; }
  .btn.off { background: var(--dis); color: #b8b0d0; box-shadow: 0 3px 0 #2a2440; }
  .btn.good { background: linear-gradient(180deg, #74f0a8, var(--good)); color: #0d2a1a; box-shadow: 0 3px 0 #2a8a55; }
  .btn.gold { background: linear-gradient(180deg, #ffe08a, var(--gold)); color: #3a2800; box-shadow: 0 3px 0 #b88a1c; }
  .btn.gem { background: linear-gradient(180deg, #9af0ff, var(--gem)); color: #062a33; box-shadow: 0 3px 0 #2aa0bb; }
  .btn.bad { background: linear-gradient(180deg, #ff7d93, var(--bad)); box-shadow: 0 3px 0 #a3283f; }
  .btn.wide { width: 100%; padding: 13px; font-size: 16px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-width: 0; }

  /* ---------- Шторка ---------- */
  #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: none; z-index: 9; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 10;
    background: linear-gradient(180deg, var(--bg2), var(--bg)); border-top: 2px solid var(--accent);
    border-radius: 20px 20px 0 0; max-height: 78%; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .22s ease; box-shadow: 0 -10px 40px rgba(140, 90, 255, .25);
  }
  #sheet.open { transform: none; }
  #sheetHead { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  #sheetTitle { font-size: 20px; font-weight: 900; }
  #sheetClose { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--bad); color: #fff; font-size: 16px; }
  #sheetBody { overflow-y: auto; padding: 0 12px 22px; display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--panel); border-radius: 13px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 255, 255, .04); }
  .row .ic { font-size: 26px; width: 34px; text-align: center; flex: none; }
  .row .t { flex: 1; min-width: 0; }
  .row .n { font-weight: 900; }
  .row .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .row .d b { color: var(--text); }
  .bar { height: 6px; border-radius: 4px; background: #17122a; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #c9a8ff); border-radius: 4px; }
  .card { background: var(--panel); border-radius: 13px; padding: 14px; line-height: 1.55; }
  .card .muted, .muted { color: var(--muted); font-size: 13.5px; }
  .hdr { color: var(--gold); font-weight: 900; margin-top: 6px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pet {
    position: relative; background: var(--panel); border-radius: 12px; padding: 8px 2px 6px; text-align: center;
    border: 2px solid var(--rc, #555); box-shadow: inset 0 0 14px color-mix(in srgb, var(--rc, #555) 35%, transparent);
  }
  .pet .e { font-size: 30px; line-height: 1.1; }
  .pet .b { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .pet .tier { position: absolute; left: 4px; top: 3px; font-size: 9.5px; font-weight: 900; color: var(--rc); }
  .pet.eq::after {
    content: "✓"; position: absolute; right: 3px; top: 1px; font-size: 12px; font-weight: 900; color: #0d2a1a;
    background: var(--good); border-radius: 50%; width: 16px; height: 16px; line-height: 16px;
  }
  .pet.del { animation: wobble .4s infinite; }
  .slots { display: flex; gap: 8px; justify-content: center; margin: 4px 0 2px; }
  .slot {
    width: 54px; height: 54px; border-radius: 14px; border: 2px dashed #4a4170; display: grid; place-items: center; font-size: 28px;
  }
  .slot.f { border-style: solid; border-color: var(--rc); box-shadow: 0 0 12px color-mix(in srgb, var(--rc) 50%, transparent); }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, .05); }
  .stat:last-child { border-bottom: 0; }
  .stat span:last-child { font-weight: 900; text-align: right; }

  /* ---------- Уведомления и оверлеи ---------- */
  #toasts { position: fixed; left: 0; right: 0; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; }
  .toast {
    background: rgba(18, 14, 30, .95); border: 2px solid var(--accent); border-radius: 12px; padding: 8px 14px;
    font-weight: 800; font-size: 14px; max-width: 90%; text-align: center; transition: opacity .4s, transform .4s;
    animation: drop .25s ease;
  }
  #modal {
    position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: rgba(5, 3, 12, .8); backdrop-filter: blur(4px); padding: 24px;
  }
  #modal .box {
    width: 100%; max-width: 360px; background: linear-gradient(180deg, var(--panel2), var(--bg2)); border-radius: 20px;
    padding: 22px 18px 18px; text-align: center; border: 2px solid var(--rc, var(--accent));
    box-shadow: 0 0 40px color-mix(in srgb, var(--rc, var(--accent)) 50%, transparent);
  }
  #modal .big { font-size: 74px; line-height: 1.1; margin: 6px 0; }
  #modal .big.shake { animation: eggshake .9s ease; }
  #modal .big.reveal { animation: reveal .5s ease; }
  #modal h2 { margin: 6px 0 4px; font-size: 22px; }
  #modal p { margin: 4px 0 14px; color: var(--muted); }

  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
  @keyframes banner { 0% { opacity: 0; transform: scale(2); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
  @keyframes eggshake {
    0%, 100% { transform: rotate(0); } 15% { transform: rotate(-14deg); } 30% { transform: rotate(14deg); }
    45% { transform: rotate(-10deg); } 60% { transform: rotate(10deg) scale(1.1); } 80% { transform: rotate(-4deg) scale(1.2); }
  }
  @keyframes reveal { from { transform: scale(.2) rotate(-30deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wobble { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="lvl"><div><span><small>УР.</small><b id="lvlNum">1</b></span></div></div>
    <div id="mid">
      <div id="ess">🌑 0</div>
      <div id="info"></div>
    </div>
    <div id="gems">💎 0</div>
  </div>
  <div id="zonebar">
    <button id="prevZone" aria-label="Предыдущая зона">◀</button>
    <div id="zname"></div>
    <button id="nextZone" aria-label="Следующая зона">▶</button>
  </div>
  <div id="arenaWrap">
    <canvas id="cv"></canvas>
    <div id="hint">👆 Нажимайте на призраков, чтобы ловить их</div>
    <div id="banner">⚔ ХРАНИТЕЛЬ ЗОНЫ!</div>
    <button id="gift" aria-label="Ежедневная награда">🎁<i class="dot"></i></button>
    <div id="lock">
      <div class="big">🔒</div>
      <div id="lockText"></div>
      <button id="lockBtn" class="btn"></button>
    </div>
  </div>
  <div id="nav">
    <button data-panel="upgrades"><span>⚡</span>Прокачка</button>
    <button data-panel="pets"><span>🐾</span>Питомцы</button>
    <button data-panel="quests"><span>📜</span>Задания<i class="navdot" id="questDot"></i></button>
    <button data-panel="profile"><span>👤</span>Профиль</button>
    <button data-panel="rebirth"><span>♻️</span>Рождение</button>
    <button data-panel="shop"><span>💎</span>Магазин</button>
  </div>
</div>

<div id="shade"></div>
<div id="sheet">
  <div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="Закрыть">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toasts"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
"use strict";
// =====================================================================
// БАЛАНС
// =====================================================================
const ZONES = [
  { name: "Сумеречный лес",  price: 0,      hp: 3,   value: 1,   egg: 200,     sky: [10, 18, 20], floor: [30, 50, 40],  shadow: [22, 16, 40], glow: [160, 110, 255], fx: "fireflies", fxColor: [210, 255, 130] },
  { name: "Туманные болота", price: 500,    hp: 12,  value: 6,   egg: 2500,    sky: [8, 20, 24],  floor: [30, 56, 60],  shadow: [16, 36, 44], glow: [90, 225, 185],  fx: "fog",       fxColor: [170, 235, 215] },
  { name: "Пепельные руины", price: 5000,   hp: 40,  value: 25,  egg: 30000,   sky: [24, 10, 8],  floor: [66, 38, 30],  shadow: [48, 16, 12], glow: [255, 125, 60],  fx: "embers",    fxColor: [255, 160, 70] },
  { name: "Ледяной склеп",   price: 50000,  hp: 150, value: 120, egg: 350000,  sky: [10, 18, 36], floor: [48, 70, 100], shadow: [18, 30, 66], glow: [135, 215, 255], fx: "snow",      fxColor: [235, 248, 255] },
  { name: "Бездна",          price: 500000, hp: 600, value: 600, egg: 4000000, sky: [6, 2, 14],   floor: [34, 14, 50],  shadow: [56, 0, 88],  glow: [255, 80, 215],  fx: "void",      fxColor: [255, 130, 245] },
];

const UPG = {
  power:   { icon: "🔦", name: "Сила фонаря",  base: 10,  g: 1.45, max: 300, eff: l => `урон ${fmt((1 + l) * dmgMultNoPower())}` },
  crit:    { icon: "🎯", name: "Шанс крита",   base: 60,  g: 1.75, max: 50,  eff: l => `${Math.round(critChanceAt(l) * 100)}%` },
  critDmg: { icon: "💥", name: "Сила крита",   base: 90,  g: 1.7,  max: 40,  eff: l => fmtMult(critMultAt(l)) },
  greed:   { icon: "💰", name: "Жадность",     base: 25,  g: 1.55, max: 200, eff: l => `+${l * 10}% эссенции` },
  luck:    { icon: "🍀", name: "Удача",        base: 120, g: 1.85, max: 30,  eff: l => `${(goldChanceAt(l) * 100).toFixed(1)}% золотых` },
  spirit:  { icon: "✨", name: "Дух-помощник", base: 200, g: 1.6,  max: 150, eff: l => l ? `${l * 30}% урона/сек` : "нет" },
};
const UPG_DESC = {
  power: "Больше урона за каждое касание",
  crit: "Шанс нанести критический удар",
  critDmg: "Во сколько раз крит сильнее",
  greed: "Больше эссенции за каждую тень",
  luck: "Чаще появляются золотые тени (x10 и 💎)",
  spirit: "Питомцы сами атакуют теней каждую секунду",
};

const RARITY = {
  common:    { name: "Обычный",     color: "#b9b3cc", ess: 0.10, dmg: 0.00 },
  rare:      { name: "Редкий",      color: "#4fa3ff", ess: 0.25, dmg: 0.05 },
  epic:      { name: "Эпический",   color: "#c06bff", ess: 0.60, dmg: 0.20 },
  legendary: { name: "Легендарный", color: "#ffb020", ess: 1.50, dmg: 0.50 },
};
const RARITY_ORDER = ["common", "rare", "epic", "legendary"];
const PET_POOL = {
  common:    [["🦇", "Ночная мышь"], ["🕷️", "Паучок"], ["🐀", "Подвальная крыса"]],
  rare:      [["🐈‍⬛", "Теневой кот"], ["🦉", "Сова-призрак"]],
  epic:      [["👻", "Фантом"], ["🐺", "Лунный волк"]],
  legendary: [["🐉", "Дракон Бездны"], ["🔮", "Око тьмы"]],
};
const EGG_ODDS = { common: 0.62, rare: 0.27, epic: 0.09, legendary: 0.02 };
const GOLD_EGG_ODDS = { common: 0.30, rare: 0.40, epic: 0.22, legendary: 0.08 };
const GOLD_EGG_PRICE = 25; // 💎
const PET_SLOTS = 3, PET_INVENTORY = 40;

const REBIRTH = { base: 25000, growth: 3, per: 0.5 };
const DAILY = { cooldown: 20 * 3600, window: 48 * 3600, max: 7, base: 250 };
const BOSS = { kills: 25, hpMult: 50, time: 30, rewardMult: 60 };
const SHADOWS_PER_ZONE = 8, RESPAWN_TIME = 2.5, CLICK_COOLDOWN = 0.08;

const PASSES = [
  { key: "DoubleEssence", icon: "✖️2", name: "x2 Эссенция", desc: "Навсегда удваивает всю эссенцию", price: 199 },
  { key: "AutoCatch", icon: "🤖", name: "Авто-ловля", desc: "Фонарь сам бьёт 2 раза в секунду", price: 249 },
  { key: "PetSlot", icon: "🐾", name: "+1 слот питомца", desc: "4 питомца вместо 3", price: 149 },
  { key: "VIP", icon: "👑", name: "Теневой VIP", desc: "+50% эссенции и золотое имя", price: 299 },
];
const PRODUCTS = [
  { key: "Boost", icon: "⚡", kind: "boost", name: "Буст x2 на 15 минут", duration: 900, price: 49 },
  { key: "Gems", icon: "💎", kind: "gems", name: "Мешочек кристаллов", amount: 50, price: 99 },
  { key: "EssenceMedium", icon: "🧪", kind: "essence", name: "Сосуд эссенции", amount: 5000, price: 99 },
  { key: "EssenceLarge", icon: "📦", kind: "essence", name: "Сундук эссенции", amount: 50000, price: 399 },
];

const QUESTS = [
  { id: "kills",  icon: "👻", name: "Ловец теней",       stat: s => s.stats.kills,  text: n => `Поймать ${fmt(n)} теней`,       goals: [25, 100, 500, 2000, 10000, 50000], rewards: [2, 5, 10, 20, 40, 80] },
  { id: "golden", icon: "✨", name: "Золотая лихорадка", stat: s => s.stats.golden, text: n => `Поймать ${n} золотых теней`,   goals: [1, 10, 50, 200],                  rewards: [3, 8, 20, 50] },
  { id: "bosses", icon: "⚔️", name: "Гроза Хранителей",  stat: s => s.stats.bosses, text: n => `Победить ${n} Хранителей`,     goals: [1, 5, 20, 50],                    rewards: [5, 15, 40, 80] },
  { id: "eggs",   icon: "🥚", name: "Заводчик",          stat: s => s.stats.eggs,   text: n => `Открыть ${n} яиц`,             goals: [1, 10, 50, 200],                  rewards: [2, 8, 20, 50] },
  { id: "crits",  icon: "🎯", name: "Точный удар",       stat: s => s.stats.crits,  text: n => `Нанести ${fmt(n)} критов`,      goals: [50, 500, 5000, 25000],            rewards: [2, 8, 20, 40] },
  { id: "level",  icon: "⭐", name: "Опыт тьмы",         stat: s => s.level,        text: n => `Достичь ${n} уровня`,          goals: [5, 10, 20, 35, 50],               rewards: [3, 8, 15, 30, 60] },
  { id: "zones",  icon: "🗺️", name: "Исследователь",     stat: s => s.maxZone,      text: n => `Открыть зону ${n}`,            goals: [2, 3, 4, 5],                      rewards: [5, 10, 25, 50] },
];

// =====================================================================
// СОХРАНЕНИЕ
// =====================================================================
const SAVE_KEY = "shadowworld_proto_v2";
function fresh() {
  return {
    essence: 0, total: 0, gems: 0, rebirths: 0, zone: 1, maxZone: 1, level: 1, xp: 0,
    up: { power: 0, crit: 0, critDmg: 0, greed: 0, luck: 0, spirit: 0 },
    pets: [], eq: [], zk: {}, q: {},
    stats: { kills: 0, golden: 0, bosses: 0, eggs: 0, crits: 0, taps: 0, time: 0 },
    lastDaily: 0, streak: 0, boostEnds: 0, passes: {}, lastSeen: 0,
  };
}
let S = fresh();
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const d = JSON.parse(raw), f = fresh();
    S = Object.assign(f, d);

    const step = Math.min(d, speed * dt);
    s.x += dx / d * step; s.y += dy / d * step;
    if (Math.abs(dx) > 1) s.dir = dx > 0 ? 1 : -1;
  }

  for (let i = respawns.length - 1; i >= 0; i--) {
    respawns[i] -= dt;
    if (respawns[i] <= 0 && view <= S.zone) { respawns.splice(i, 1); shadows.push(spawnRegular()); }
  }
  if (!boss && view <= S.zone && (S.zk[view] || 0) >= BOSS.kills) summonBoss();

  // эффекты
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy = p.vy * 0.93 + 60 * dt;
    if (p.t > p.life) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; f.y -= (f.kind === "crit" ? 60 : 45) * dt; if (f.t > 0.95) floats.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; if (r.t > 0.5) rings.splice(i, 1); }
  for (let i = lights.length - 1; i >= 0; i--) { lights[i].t += dt; if (lights[i].t > 0.35) lights.splice(i, 1); }
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i]; o.t += dt;
    if (o.t >= 0.65) { orbs.splice(i, 1); essPulse = 0.12; }
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    if (!shadows.includes(b.target)) { bolts.splice(i, 1); continue; }
    const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy);
    if (d < b.target.r * 0.6) { bolts.splice(i, 1); hit(b.target, "spirit"); continue; }
    const step = 520 * dt; b.x += dx / d * step; b.y += dy / d * step;
    b.trail.push([b.x, b.y]); if (b.trail.length > 8) b.trail.shift();
  }
  for (const a of ambient) a.t += dt;
  const fx = zone().fx;
  for (let i = 0; i < ambient.length; i++) {
    const a = ambient[i];
    if (fx === "void") { a.ang += dt * (40 / a.rad); a.rad -= dt * 14; a.x = a.cx + Math.cos(a.ang) * a.rad; a.y = a.cy + Math.sin(a.ang) * a.rad * 0.6; if (a.rad < 8) ambient[i] = newAmbient(false); continue; }
    a.x += (a.vx + (fx === "snow" ? Math.sin(a.t) * 10 : 0)) * dt; a.y += a.vy * dt;
    if (fx === "fireflies") { a.vx += rnd(-20, 20) * dt; a.vy += rnd(-20, 20) * dt; a.vx = Math.max(-15, Math.min(15, a.vx)); a.vy = Math.max(-15, Math.min(15, a.vy)); }
    if (a.x < -10) a.x = W + 10; if (a.x > W + 10) a.x = -10;
    if (a.y < -10 || a.y > H + 10) ambient[i] = newAmbient(false);
  }
  for (const f of fogs) { f.x += f.v * dt; if (f.x < -f.r) f.x = W + f.r; if (f.x > W + f.r) f.x = -f.r; }
  shakeT = Math.max(0, shakeT - dt); if (shakeT === 0) shakeMag = 0;
  essPulse = Math.max(0, essPulse - dt);

  if (view <= S.zone && shadows.length) {
    // Авто-ловля (Game Pass)
    if (S.passes.AutoCatch) {
      autoTimer += dt;
      if (autoTimer >= 0.5) {
        autoTimer = 0;
        let target = boss || shadows[0];
        if (!boss) for (const s of shadows) if (s.hp < target.hp) target = s;
        hit(target, "auto");
      }
    }
    // Дух-помощник: питомцы стреляют сгустками
    if (S.up.spirit > 0) {
      spiritTimer += dt;
      if (spiritTimer >= 1) {
        spiritTimer = 0;
        const src = petPositions();
        const from = src[petSource++ % src.length];
        let target = boss || shadows[(Math.random() * shadows.length) | 0];
        bolts.push({ x: from.x, y: from.y - 16, target, trail: [], color: from.p ? hexToRgb(RARITY[from.p.r].color) : [200, 170, 255] });
      }
    }
  }
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

// =====================================================================
// АРЕНА: ОТРИСОВКА
// =====================================================================
function ghostPath(r, t) {
  ctx.beginPath();
  const top = -r * 0.2, bottom = r * 0.9;
  ctx.arc(0, top, r, Math.PI, 0);
  ctx.lineTo(r, bottom);
  const waves = 4;
  for (let i = waves; i > 0; i--) {
    const x1 = -r + 2 * r * (i - 0.5) / waves, x2 = -r + 2 * r * (i - 1) / waves;
    ctx.quadraticCurveTo(x1, bottom + r * 0.32 + Math.sin(t * 2.2 + i * 1.7) * r * 0.12, x2, bottom);
  }
  ctx.closePath();
}

function drawShadow(s) {
  const z = zone(), t = s.phase;
  const isGold = s.kind === "gold", isBoss = s.kind === "boss";
  const glow = isGold ? [255, 210, 80] : isBoss ? [255, 50, 80] : z.glow;
  const bob = Math.sin(t) * s.r * 0.08;
  const spawnK = 1 - s.spawn / 0.45;
  const sx = (1 + s.sq * 1.2) * spawnK, sy = (1 - s.sq * 0.9) * spawnK;

  ctx.save();
  ctx.translate(s.x, s.y + bob);

  // тень на земле
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(0, s.r * 1.45 - bob, s.r * 0.8, s.r * 0.18, 0, 0, 6.283); ctx.fill();

  // аура
  const aura = ctx.createRadialGradient(0, 0, s.r * 0.4, 0, 0, s.r * (isBoss ? 2.6 : 2));
  aura.addColorStop(0, rgba(glow, isBoss ? 0.5 + Math.sin(t * 2) * 0.15 : 0.42)); aura.addColorStop(1, rgba(glow, 0));
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(0, 0, s.r * (isBoss ? 2.6 : 2), 0, 6.283); ctx.fill();

  ctx.scale(sx * s.dir, sy);
  ctx.rotate(Math.sin(t * 0.7) * 0.06);

  // рога босса
  if (isBoss) {
    ctx.fillStyle = "#1a0a12";
    for (const k of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(k * s.r * 0.35, -s.r * 0.95); ctx.quadraticCurveTo(k * s.r * 0.9, -s.r * 1.5, k * s.r * 0.95, -s.r * 1.75); ctx.lineTo(k * s.r * 0.65, -s.r * 0.85); ctx.fill();
    }
  }

  // тело
  ghostPath(s.r, t);
  const body = ctx.createLinearGradient(0, -s.r * 1.2, 0, s.r * 1.2);
  if (s.flash > 0) { body.addColorStop(0, "#ffffff"); body.addColorStop(1, rgba(glow, 0.9)); }
  else if (isGold) { body.addColorStop(0, "#fff1b0"); body.addColorStop(0.5, "#ffc93d"); body.addColorStop(1, "rgba(190,120,20,0.7)"); }
  else if (isBoss) { body.addColorStop(0, "#3a1426"); body.addColorStop(1, "rgba(10,0,8,0.85)"); }
  else { body.addColorStop(0, rgba(mix(z.shadow, 2.6))); body.addColorStop(0.6, rgba(z.shadow)); body.addColorStop(1, rgba(z.shadow, 0.55)); }
  ctx.shadowColor = rgba(glow, 0.9); ctx.shadowBlur = s.r * 0.6;
  ctx.fillStyle = body; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = Math.max(1.5, s.r * 0.06); ctx.strokeStyle = rgba(glow, 0.65); ctx.stroke();

  // блик
  ctx.fillStyle = "rgba(255,255,255,0.13)";
  ctx.beginPath(); ctx.ellipse(-s.r * 0.35, -s.r * 0.55, s.r * 0.22, s.r * 0.12, -0.6, 0, 6.283); ctx.fill();

  // глаза
  const eyeH = s.blink < 0 ? 0.04 : (isBoss ? 0.16 : 0.22);
  const eyeColor = isBoss ? "#ff3048" : isGold ? "#6a3c00" : rgba(mix(glow, 1.2));
  ctx.fillStyle = eyeColor; ctx.shadowColor = eyeColor; ctx.shadowBlur = isGold ? 0 : s.r * 0.4;
  for (const ex of [-0.32, 0.32]) {
    ctx.beginPath(); ctx.ellipse(ex * s.r + s.r * 0.05, -s.r * 0.18, s.r * (isBoss ? 0.17 : 0.13), s.r * eyeH, isBoss ? ex * 1.2 : 0, 0, 6.283); ctx.fill();
  }
  ctx.shadowBlur = 0;
  // рот
  ctx.strokeStyle = isGold ? "#6a3c00" : rgba(glow, 0.8); ctx.lineWidth = Math.max(1.2, s.r * 0.05);
  ctx.beginPath();
  if (isBoss) { ctx.moveTo(-s.r * 0.3, s.r * 0.22); for (let i = 1; i <= 6; i++) ctx.lineTo(-s.r * 0.3 + i * s.r * 0.1, s.r * (i % 2 ? 0.32 : 0.22)); }
  else ctx.arc(s.r * 0.05, s.r * 0.12, s.r * 0.14, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.restore();

  // искорки у золотой
  if (isGold && Math.random() < 0.3) particles.push({ x: s.x + rnd(-s.r, s.r), y: s.y + rnd(-s.r, s.r), vx: 0, vy: -20, t: 0, life: 0.5, color: [255, 230, 120], r: 1.8 });

  // полоска здоровья
  if (!isBoss && s.hp < s.max) {
    const w = s.r * 2, y = s.y - s.r * 1.55 + bob;
    ctx.fillStyle = "rgba(10,6,20,0.85)"; roundRect(s.x - w / 2 - 1, y - 1, w + 2, 7, 3); ctx.fill();
    ctx.fillStyle = rgba(glow); roundRect(s.x - w / 2, y, w * Math.max(0, s.hp / s.max), 5, 2.5); ctx.fill();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawAmbient() {
  const z = zone(), c = z.fxColor;
  for (const f of fogs) {
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0, rgba(z.fx === "embers" ? [80, 40, 30] : c, z.fx === "fog" ? 0.13 : 0.06)); g.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = g; ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
  }
  for (const a of ambient) {
    let alpha = 0.8;
    if (z.fx === "fireflies") alpha = 0.35 + 0.65 * Math.max(0, Math.sin(a.t * 2.5));
    if (z.fx === "fog") alpha = 0.18;
    if (z.fx === "embers") alpha = 0.5 + 0.5 * Math.sin(a.t * 6);
    if (z.fx === "void") alpha = Math.min(1, a.rad / 60);
    if (z.fx === "fireflies" || z.fx === "embers" || z.fx === "void") {
      const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.s * 4);
      g.addColorStop(0, rgba(c, alpha)); g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g; ctx.fillRect(a.x - a.s * 4, a.y - a.s * 4, a.s * 8, a.s * 8);
    } else {
      ctx.fillStyle = rgba(c, alpha); ctx.beginPath(); ctx.arc(a.x, a.y, a.s, 0, 6.283); ctx.fill();
    }
  }
}

function drawPets(t) {
  const list = petPositions();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  list.forEach((pp, i) => {
    const y = pp.y + Math.sin(t * 2.4 + i) * 4;
    const color = pp.p ? hexToRgb(RARITY[pp.p.r].color) : [200, 170, 255];
    const g = ctx.createRadialGradient(pp.x, y, 2, pp.x, y, 26);
    g.addColorStop(0, rgba(color, 0.45)); g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pp.x, y, 26, 0, 6.283); ctx.fill();
    if (pp.p) { ctx.font = "26px system-ui, 'Apple Color Emoji', sans-serif"; ctx.fillText(petInfo(pp.p)[0], pp.x, y); }
    else { ctx.fillStyle = "rgba(230,215,255,0.9)"; ctx.beginPath(); ctx.arc(pp.x, y, 7, 0, 6.283); ctx.fill(); }
  });
  ctx.textBaseline = "alphabetic";
}

function drawHudOnCanvas() {
  const z = zone();
  ctx.textAlign = "left"; ctx.font = "800 12px system-ui, sans-serif";
  if (view <= S.zone && !boss) {
    const k = (S.zk[view] || 0) / BOSS.kills, w = Math.min(150, W * 0.42);
    ctx.fillStyle = "rgba(10,6,20,0.7)"; roundRect(10, 10, w, 30, 9); ctx.fill();
    ctx.fillStyle = "#f3efff"; ctx.fillText(`⚔ Хранитель ${S.zk[view] || 0}/${BOSS.kills}`, 18, 24);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; roundRect(18, 30, w - 16, 4, 2); ctx.fill();
    ctx.fillStyle = "#ff5a6e"; roundRect(18, 30, (w - 16) * k, 4, 2); ctx.fill();
  }
  if (boss) {
    const w = W - 80, x = 12, y = 12;
    ctx.fillStyle = "rgba(10,6,20,0.8)"; roundRect(x, y, w, 34, 10); ctx.fill();
    ctx.fillStyle = "#ffd0d6"; ctx.fillText(`ХРАНИТЕЛЬ • ${fmt(Math.max(0, boss.hp))} / ${fmt(boss.max)}`, x + 10, y + 15);
    ctx.textAlign = "right"; ctx.fillStyle = boss.time < 10 ? "#ff5a6e" : "#f3efff";
    ctx.fillText(`⏱ ${Math.ceil(boss.time)}с`, x + w - 10, y + 15); ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.1)"; roundRect(x + 10, y + 22, w - 20, 6, 3); ctx.fill();
    const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, "#ff2a4a"); g.addColorStop(1, "#ff8a5a");
    ctx.fillStyle = g; roundRect(x + 10, y + 22, (w - 20) * Math.max(0, boss.hp / boss.max), 6, 3); ctx.fill();
  }
  if (combo >= 5) {
    const k = Math.min(combo, 50) / 50;
    ctx.textAlign = "center"; ctx.font = `900 ${16 + k * 8}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,0.6)";
    const txt = `КОМБО ${combo}  ${fmtMult(comboMult())}`;
    const y = boss ? 66 : 62;
    ctx.strokeText(txt, W / 2, y);
    ctx.fillStyle = `hsl(${45 - k * 45}, 100%, ${65 - k * 10}%)`; ctx.fillText(txt, W / 2, y);
  }
}

let lastFrame = performance.now();
function draw() {
  const t = performance.now() / 1000;
  ctx.save();
  if (shakeT > 0) ctx.translate(rnd(-shakeMag, shakeMag), rnd(-shakeMag, shakeMag));
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawAmbient();

  for (const l of lights) {
    const k = l.t / 0.35, r = 40 + k * 30;
    const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, r);
    g.addColorStop(0, `rgba(255,240,200,${0.35 * (1 - k)})`); g.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(l.x, l.y, r, 0, 6.283); ctx.fill();
  }

  const sorted = shadows.slice().sort((a, b) => a.y - b.y);
  for (const s of sorted) drawShadow(s);

  for (const r of rings) {
    const k = r.t / 0.5;
    ctx.strokeStyle = rgba(r.color, 1 - k); ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r + (r.max - r.r) * k, 0, 6.283); ctx.stroke();
  }
  for (const p of particles) {
    ctx.fillStyle = rgba(p.color, Math.max(0, 1 - p.t / p.life));
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  for (const b of bolts) {
    for (let i = 0; i < b.trail.length; i++) {
      const [x, y] = b.trail[i];
      ctx.fillStyle = rgba(b.color, (i + 1) / b.trail.length * 0.6);
      ctx.beginPath(); ctx.arc(x, y, 2 + i * 0.5, 0, 6.283); ctx.fill();
    }
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 12);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.3, rgba(b.color, 0.9)); g.addColorStop(1, rgba(b.color, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, 6.283); ctx.fill();
  }
  drawPets(t);

  for (const o of orbs) {
    if (o.t < 0) continue;
    const k = Math.min(1, o.t / 0.65), e = k * k * (3 - 2 * k);
    const tx = W / 2, ty = -10;
    const x = o.sx + (tx - o.sx) * e + Math.sin(k * 3.14) * 40 * (o.sx < W / 2 ? -1 : 1);
    const y = o.sy + (ty - o.sy) * e;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.4, rgba(o.color, 0.9)); g.addColorStop(1, rgba(o.color, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.283); ctx.fill();
  }

  ctx.textAlign = "center";
  for (const f of floats) {
    const a = Math.max(0, 1 - Math.max(0, f.t - 0.35) / 0.6);
    const pop = f.t < 0.12 ? 1 + (0.12 - f.t) * 5 : 1;
    const size = { crit: 26, gain: 21, gem: 18, dmg: 15, spirit: 13 }[f.kind] * pop;
    const color = { crit: "#ffcf4d", gain: "#ffe28a", gem: "#7eeaff", dmg: "#ffffff", spirit: "#d9c6ff" }[f.kind];
    ctx.globalAlpha = a; ctx.font = `900 ${size}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,0.65)"; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  drawHudOnCanvas();
  ctx.restore();
}

function frame(ts) {
  const dt = Math.min(0.05, (ts - lastFrame) / 1000);
  lastFrame = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

function updateZoneBar() {

}
$("prevZone").onclick = () => { if (view > 1) { view--; fillZone(); } };

$("lockBtn").onclick = buyZone;

let buyMode = 1; // 1, 10 или Infinity (макс)
function buyUpgrade(id) {
  const u = UPG[id];
  let n = 0, cost = 0;
  while (n < buyMode && S.up[id] + n < u.max) {
    const c = upCost(id, S.up[id] + n);
    if (S.essence < cost + c) break;
    cost += c; n++;
  }
  if (S.up[id] >= u.max) return toast("Это улучшение на максимуме", "bad");
  if (n === 0) return toast("Не хватает эссенции", "bad");
  S.essence -= cost; S.up[id] += n; save();
}
function buyZone() {
  const next = ZONES[S.zone];
  if (!next) return toast("Все зоны уже открыты!");
  if (S.essence < next.price) return toast("Не хватает эссенции", "bad");
  S.essence -= next.price; S.zone++; S.maxZone = Math.max(S.maxZone, S.zone); view = S.zone; save();
  fillZone();
  toast(`🗺 Открыта зона «${next.name}»!`, "good");
}
function doRebirth() {
  const cost = rebirthCost(S.rebirths);
  if (S.essence < cost) return toast(`Нужно ${fmt(cost)} эссенции`, "bad");
  const gems = 10 * (S.rebirths + 1);
  S.rebirths++; S.essence = 0; S.zone = 1; S.zk = {}; S.gems += gems;
  for (const k in S.up) S.up[k] = 0;
  view = 1; save(); fillZone(); closeSheet();
  showModal(`<div class="big reveal">♻️</div><h2>Перерождение ${S.rebirths}!</h2>
    <p>Множитель эссенции: <b>${fmtMult(rebirthMult(S.rebirths))}</b><br>Награда: <b>+${gems} 💎</b><br>Питомцы, уровень и кристаллы сохранены.</p>
    <button class="btn wide gold" data-close>Вперёд!</button>`, "var(--gold)");
}
function claimDaily() {
  if (!dailyReady()) return toast("Награда будет через " + fmtTime(DAILY.cooldown - (now() - S.lastDaily)), "bad");
  const st = nextStreak(), reward = dailyReward(st), gems = st;
  S.streak = st; S.lastDaily = now(); S.essence += reward; S.total += reward; S.gems += gems; save();
  showModal(`<div class="big reveal">🎁</div><h2>День ${st} из ${DAILY.max}</h2>
    <p><b>+${fmt(reward)}</b> эссенции и <b>+${gems} 💎</b><br>Заходите завтра — награда вырастет!</p>
    <button class="btn wide good" data-close>Забрать</button>`, "var(--gold)");
}
$("gift").onclick = claimDaily;

function rollRarity(odds) {
  let r = Math.random();
  for (const k of RARITY_ORDER) { if (r < odds[k]) return k; r -= odds[k]; }
  return "common";
}
function openEgg(tier, golden) {
  if (S.pets.length >= PET_INVENTORY) return toast("Инвентарь полон — удалите слабых питомцев", "bad");
  if (golden) { if (S.gems < GOLD_EGG_PRICE) return toast("Не хватает кристаллов 💎", "bad"); S.gems -= GOLD_EGG_PRICE; }
  else { const c = ZONES[tier - 1].egg; if (S.essence < c) return toast("Не хватает эссенции", "bad"); S.essence -= c; }
  const r = rollRarity(golden ? GOLD_EGG_ODDS : EGG_ODDS);
  const pet = { uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), r, k: (Math.random() * PET_POOL[r].length) | 0, t: tier };
  S.pets.push(pet); S.stats.eggs++;
  let autoEq = false;
  if (S.eq.length < petSlots()) { S.eq.push(pet.uid); autoEq = true; }
  save();
  const info = petInfo(pet), st = petStats(pet), rc = RARITY[r].color;
  showModal(`<div class="big shake">${golden ? "🌟" : "🥚"}</div><p>Вылупляется…</p>`, rc);
  setTimeout(() => {
    showModal(`<div class="big reveal">${info[0]}</div>
      <div style="color:${rc};font-weight:900;letter-spacing:1px">${RARITY[r].name.toUpperCase()} • T${tier}</div>
      <h2>${info[1]}</h2>
      <p>${pct(st.ess)} эссенции${st.dmg ? ` • ${pct(st.dmg)} урона` : ""}${autoEq ? "<br>✓ Сразу экипирован" : ""}</p>
      <div class="seg"><button class="btn good" data-close>Круто!</button></div>`, rc);
    if (r === "legendary" || r === "epic") shake(8, 0.4);
  }, 950);
}
function toggleEquip(uid) {
  const i = S.eq.indexOf(uid);
  if (i >= 0) S.eq.splice(i, 1);
  else if (S.eq.length < petSlots()) S.eq.push(uid);
  else return toast(`Максимум ${petSlots()} питомца — снимите одного`, "bad");
  save();
}
function equipBest() {
  S.eq = S.pets.slice().sort((a, b) => petPower(b) - petPower(a)).slice(0, petSlots()).map(p => p.uid);
  save(); toast("Экипированы лучшие питомцы", "good");
}
function deletePet(uid) {
  S.pets = S.pets.filter(p => p.uid !== uid);
  S.eq = S.eq.filter(u => u !== uid);
  save();
}
function claimQuest(q) {
  const tier = S.q[q.id] || 0;
  if (tier >= q.goals.length || q.stat(S) < q.goals[tier]) return;
  S.gems += q.rewards[tier]; S.q[q.id] = tier + 1; save();
  toast(`📜 ${q.name}: +${q.rewards[tier]} 💎`, "gem");
}
const questReady = q => { const t = S.q[q.id] || 0; return t < q.goals.length && q.stat(S) >= q.goals[t]; };

function gemBoost() {
  if (S.gems < 10) return toast("Не хватает кристаллов 💎", "bad");
  S.gems -= 10; S.boostEnds = Math.max(S.boostEnds, now()) + 300; save();
  toast("⚡ Буст x2 на 5 минут!", "good");
}
function demoPass(p) { S.passes[p.key] = true; save(); toast(`Демо-покупка: ${p.name} (в Roblox — ${p.price} R$)`, "good"); }
function demoProduct(p) {
  if (p.kind === "boost") S.boostEnds = Math.max(S.boostEnds, now()) + p.duration;
  if (p.kind === "gems") S.gems += p.amount;
  if (p.kind === "essence") { const a = packAmount(p); S.essence += a; S.total += a; }
  save(); toast(`Демо: ${p.name} (в Roblox — ${p.price} R$)`, "good");
}

// =====================================================================
// ПАНЕЛИ
// =====================================================================
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function row(icon, name, desc) {
  const r = el("div", "row"), ic = el("div", "ic", icon), t = el("div", "t"), n = el("div", "n", name), d = el("div", "d", desc), b = el("button", "btn");
  t.append(n, d); r.append(ic, t, b);
  return { r, n, d, b, t };
}
function setBtn(b, text, enabled, cls) {
  if (b._t !== text) { b.textContent = text; b._t = text; }
  const c = "btn" + (b.classList.contains("wide") ? " wide" : "") + (enabled ? (cls ? " " + cls : "") : " off");
  if (b.className !== c) b.className = c;
}
function confirmable(btn, action) {
  let until = 0;
  btn.onclick = () => {
    if (Date.now() < until) { until = 0; action(); }
    else { until = Date.now() + 3000; btn.textContent = "Точно? Нажмите ещё раз"; btn._t = null; }
  };
  return () => Date.now() < until;
}

const PANELS = {
  upgrades: {
    title: "⚡ Прокачка",
    build(body) {
      const seg = el("div", "seg"), modes = [[1, "x1"], [10, "x10"], [Infinity, "МАКС"]];
      const modeBtns = modes.map(([m, label]) => { const b = el("button", "btn", label); b.onclick = () => { buyMode = m; }; seg.append(b); return [m, b]; });
      body.append(seg);
      const refs = {};
      for (const id of Object.keys(UPG)) {
        const u = UPG[id], x = row(u.icon, u.name, "");
        const bar = el("div", "bar", "<i></i>"); x.t.append(bar); x.bar = bar.firstChild;
        x.b.onclick = () => buyUpgrade(id);
        refs[id] = x; body.append(x.r);
      }
      return () => {
        for (const [m, b] of modeBtns) setBtn(b, b.textContent, true, buyMode === m ? "gold" : "");
        for (const id in refs) {
          const u = UPG[id], lvl = S.up[id], x = refs[id];
          x.n.textContent = `${u.name} • ${lvl}/${u.max}`;
          x.bar.style.width = (lvl / u.max * 100) + "%";
          if (lvl >= u.max) { x.d.innerHTML = `${UPG_DESC[id]}<br><b>${u.eff(lvl)}</b>`; setBtn(x.b, "МАКС", false); continue; }
          let n = 0, cost = 0;
          if (buyMode === Infinity) { while (lvl + n < u.max && cost + upCost(id, lvl + n) <= S.essence) { cost += upCost(id, lvl + n); n++; } if (!n) { n = 1; cost = upCost(id, lvl); } }
          else { n = Math.min(buyMode, u.max - lvl); cost = upCostN(id, lvl, n); }
          x.d.innerHTML = `${UPG_DESC[id]}<br><b>${u.eff(lvl)}</b> → <b style="color:var(--good)">${u.eff(lvl + n)}</b>`;
          setBtn(x.b, `${n > 1 ? "+" + n + " • " : ""}🌑 ${fmt(cost)}`, S.essence >= cost);
        }
      };
    },
  },

  pets: {
    title: "🐾 Питомцы",
    sig: () => [S.pets.length, S.eq.join(), S.zone, petSlots(), deleteMode].join("|"),
    build(body) {
      const pb = petBonus(), eq = equippedPets();
      const card = el("div", "card");
      const slots = el("div", "slots");
      for (let i = 0; i < petSlots(); i++) {
        const p = eq[i], s = el("div", "slot" + (p ? " f" : ""), p ? petInfo(p)[0] : "");
        if (p) s.style.setProperty("--rc", RARITY[p.r].color);
        slots.append(s);
      }
      card.append(slots, el("div", "note", `Бонус: <b style="color:var(--text)">${pct(pb.ess)} эссенции • ${pct(pb.dmg)} урона</b>`));
      body.append(card);

      const seg = el("div", "seg");
      const best = el("button", "btn good", "Экипировать лучших"); best.onclick = equipBest;
      const del = el("button", "btn" + (deleteMode ? " bad" : ""), deleteMode ? "Готово" : "🗑 Удалять");
      del.onclick = () => { deleteMode = !deleteMode; };
      seg.append(best, del); body.append(seg);

      body.append(el("div", "hdr", "Яйца"));
      const eggRefs = [];
      for (let i = 1; i <= S.zone; i++) {
        const z = ZONES[i - 1], x = row("🥚", `Яйцо: ${z.name}`, `Питомцы T${i} • сильнее с каждой зоной`);
        x.b.onclick = () => openEgg(i, false);
        eggRefs.push([x.b, () => z.egg, "essence"]); body.append(x.r);
      }
      const g = row("🌟", "Золотое яйцо", `T${S.zone} • шанс легендарного 8% (обычно 2%)`);
      g.b.onclick = () => openEgg(S.zone, true);
      eggRefs.push([g.b, () => GOLD_EGG_PRICE, "gems"]); body.append(g.r);
      body.append(el("div", "note", "Шансы: Обычный 62% • Редкий 27% • Эпический 9% • Легендарный 2%"));

      body.append(el("div", "hdr", `Инвентарь ${S.pets.length}/${PET_INVENTORY}` + (deleteMode ? " — нажмите, чтобы удалить" : " — нажмите, чтобы надеть/снять")));
      if (!S.pets.length) body.append(el("div", "note", "Пока пусто. Откройте первое яйцо!"));
      const grid = el("div", "grid");
      const sorted = S.pets.slice().sort((a, b) => petPower(b) - petPower(a));
      for (const p of sorted) {
        const st = petStats(p), equipped = S.eq.includes(p.uid);
        const c = el("div", "pet" + (equipped ? " eq" : "") + (deleteMode && !equipped ? " del" : ""),
          `<div class="tier">T${p.t}</div><div class="e">${petInfo(p)[0]}</div><div class="b">${pct(st.ess)}${st.dmg ? "<br>⚔" + pct(st.dmg) : ""}</div>`);
        c.style.setProperty("--rc", RARITY[p.r].color);
        c.onclick = () => {
          if (deleteMode) { if (equipped) return toast("Сначала снимите питомца", "bad"); deletePet(p.uid); }
          else toggleEquip(p.uid);
        };
        grid.append(c);
      }
      body.append(grid);
      return () => {
        for (const [b, price, cur] of eggRefs) {
          const full = S.pets.length >= PET_INVENTORY;
          if (cur === "gems") setBtn(b, `💎 ${price()}`, !full && S.gems >= price(), "gem");
          else setBtn(b, `🌑 ${fmt(price())}`, !full && S.essence >= price());
        }
      };
    },
  },

  quests: {
    title: "📜 Задания",
    sig: () => QUESTS.map(q => S.q[q.id] || 0).join(),
    build(body) {
      body.append(el("div", "note", "Выполняйте задания и получайте кристаллы 💎 — за них можно купить Золотое яйцо и бусты."));
      const refs = QUESTS.map(q => {
        const x = row(q.icon, q.name, "");
        const bar = el("div", "bar", "<i></i>"); x.t.append(bar); x.bar = bar.firstChild;
        x.b.onclick = () => claimQuest(q);
        body.append(x.r);
        return [q, x];
      });
      return () => {
        for (const [q, x] of refs) {
          const tier = S.q[q.id] || 0;
          if (tier >= q.goals.length) { x.d.textContent = "Все этапы выполнены!"; x.bar.style.width = "100%"; setBtn(x.b, "✓", false); continue; }
          const goal = q.goals[tier], v = Math.min(q.stat(S), goal);
          x.n.textContent = `${q.name} • этап ${tier + 1}/${q.goals.length}`;
          x.d.innerHTML = `${q.text(goal)} — <b>${fmt(v)}/${fmt(goal)}</b>`;
          x.bar.style.width = (v / goal * 100) + "%";
          setBtn(x.b, v >= goal ? `Забрать ${q.rewards[tier]} 💎` : `${q.rewards[tier]} 💎`, v >= goal, "gem");
        }
      };
    },
  },

  profile: {
    title: "👤 Характеристики",
    build(body) {
      const lv = el("div", "card"), fight = el("div", "card"), econ = el("div", "card"), stats = el("div", "card");
      body.append(lv, el("div", "hdr", "⚔ Бой"), fight, el("div", "hdr", "💰 Доход"), econ, el("div", "hdr", "📊 Статистика"), stats);
      const line = (a, b) => `<div class="stat"><span>${a}</span><span>${b}</span></div>`;
      return () => {
        const need = xpNeed(S.level), pb = petBonus();
        lv.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
          <b style="font-size:18px">⭐ Уровень ${S.level}</b><span class="muted">${fmt(S.xp)} / ${fmt(need)} опыта</span></div>
          <div class="bar"><i style="width:${S.xp / need * 100}%"></i></div>
          <div class="muted" style="margin-top:6px">Каждый уровень: +3% эссенции и +1% урона</div>`;
        fight.innerHTML =
          line("🔦 Урон за касание", fmt(tapDamage())) +
          line("🎯 Шанс крита", Math.round(critChance() * 100) + "%") +
          line("💥 Сила крита", fmtMult(critMult())) +
          line("✨ Урон духов в секунду", autoDps() ? fmt(autoDps()) : "—") +
          line("🐾 Бонус урона питомцев", pct(pb.dmg)) +
          line("🍀 Шанс золотой тени", (goldChance() * 100).toFixed(1) + "%");
        econ.innerHTML =
          line("Итоговый множитель", `<span style="color:var(--gold)">${fmtMult(essMult())}</span>`) +
          line("💰 Жадность", fmtMult(1 + 0.1 * S.up.greed)) +
          line("♻️ Перерождения", fmtMult(rebirthMult(S.rebirths))) +
          line("⭐ Уровень", fmtMult(levelMult())) +
          line("🐾 Питомцы", fmtMult(1 + pb.ess)) +
          line("👑 Пропуска", fmtMult((S.passes.DoubleEssence ? 2 : 1) * (S.passes.VIP ? 1.5 : 1))) +
          line("⚡ Буст", boostActive() ? "x2 • " + fmtTime(S.boostEnds - now()) : "—") +
          line("🔥 Комбо (сейчас)", fmtMult(comboMult()));
        stats.innerHTML =
          line("Поймано теней", fmt(S.stats.kills)) + line("Золотых теней", fmt(S.stats.golden)) +
          line("Хранителей побеждено", fmt(S.stats.bosses)) + line("Критов", fmt(S.stats.crits)) +
          line("Открыто яиц", fmt(S.stats.eggs)) + line("Всего эссенции", fmt(S.total)) +
          line("Время в игре", fmtLong(S.stats.time));
      };
    },
  },

  rebirth: {
    title: "♻️ Перерождение",
    build(body) {
      const card = el("div", "card"), btn = el("button", "btn wide");
      body.append(card, btn);
      const pending = confirmable(btn, doRebirth);
      const resetBtn = el("button", "btn wide bad");
      const resetPending = confirmable(resetBtn, () => { S = fresh(); view = 1; save(); fillZone(); closeSheet(); toast("Прогресс прототипа сброшен"); });
      body.append(el("div", "hdr", "Для тестирования"), resetBtn);
      return () => {
        const c = rebirthCost(S.rebirths);
        card.innerHTML = `<div style="font-size:17px">Перерождений: <b>${S.rebirths}</b></div>
          <div>Множитель: <b>${fmtMult(rebirthMult(S.rebirths))}</b> → <b style="color:var(--good)">${fmtMult(rebirthMult(S.rebirths + 1))}</b></div>
          <div>Награда: <b>+${10 * (S.rebirths + 1)} 💎</b></div>
          <div class="muted" style="margin-top:6px">Сбросятся эссенция, прокачка и зоны.<br>Сохранятся уровень, питомцы, кристаллы и задания.</div>
          <div class="bar"><i style="width:${Math.min(100, S.essence / c * 100)}%"></i></div>`;
        if (!pending()) setBtn(btn, `Переродиться • 🌑 ${fmt(c)}`, S.essence >= c, "gold");
        if (!resetPending()) setBtn(resetBtn, "Сбросить весь прогресс", true, "bad");
      };
    },
  },

  shop: {
    title: "💎 Магазин",
    sig: () => Object.keys(S.passes).join(),
    build(body) {
      body.append(el("div", "hdr", "За кристаллы 💎"));
      const gb = row("⚡", "Буст x2 на 5 минут", "Удваивает всю эссенцию");
      gb.b.onclick = gemBoost; body.append(gb.r);

      body.append(el("div", "hdr", "Навсегда (Game Pass)"));
      body.append(el("div", "note", "Прототип: покупки за Robux здесь бесплатные — чтобы почувствовать бонусы."));
      const passRefs = PASSES.map(p => { const x = row(p.icon, p.name, p.desc); x.b.onclick = () => { if (!S.passes[p.key]) demoPass(p); }; body.append(x.r); return [p, x]; });
      body.append(el("div", "hdr", "Разовые покупки"));
      const prodRefs = PRODUCTS.map(p => { const x = row(p.icon, p.name, ""); x.b.onclick = () => demoProduct(p); body.append(x.r); return [p, x]; });
      const undo = el("button", "btn wide"); undo.onclick = () => { S.passes = {}; if (S.eq.length > petSlots()) S.eq.length = petSlots(); save(); toast("Демо-пропуска отключены"); };
      body.append(undo);
      return () => {
        setBtn(gb.b, "💎 10", S.gems >= 10, "gem");
        for (const [p, x] of passRefs) setBtn(x.b, S.passes[p.key] ? "✓ Есть" : `R$ ${p.price}`, !S.passes[p.key], "good");
        for (const [p, x] of prodRefs) {
          x.d.textContent = p.kind === "boost" ? "x2 эссенция, время складывается" : p.kind === "gems" ? `+${p.amount} 💎` : `+${fmt(packAmount(p))} эссенции`;
          setBtn(x.b, `R$ ${p.price}`, true, "good");
        }
        setBtn(undo, "Отключить демо-пропуска", Object.keys(S.passes).length > 0);
      };
    },
  },
};

let deleteMode = false;
let openName = null, panelUpdate = null, panelSig = null;
function renderPanel() {
  const p = PANELS[openName], body = $("sheetBody"), scroll = body.scrollTop;
  body.innerHTML = "";
  panelUpdate = p.build(body);
  panelSig = p.sig ? p.sig() : null;
  panelUpdate();
  body.scrollTop = scroll;
}
function openSheet(name) {
  if (openName === name) return closeSheet();
  if (name !== "pets") deleteMode = false;
  openName = name;
  $("sheetTitle").textContent = PANELS[name].title;
  $("sheetBody").scrollTop = 0;
  renderPanel();
  $("sheet").classList.add("open");
  $("shade").style.display = "block";
}
function closeSheet() {
  openName = null; panelUpdate = null; deleteMode = false;
  $("sheet").classList.remove("open");
  $("shade").style.display = "none";
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => openSheet(b.dataset.panel));
$("sheetClose").onclick = closeSheet;
$("shade").onclick = closeSheet;

// =====================================================================
// HUD
// =====================================================================
function refreshHud() {
  $("ess").textContent = `🌑 ${fmt(S.essence)}`;
  $("ess").classList.toggle("pop", essPulse > 0);
  $("gems").textContent = `💎 ${fmt(S.gems)}`;
  $("lvlNum").textContent = S.level;
  $("lvl").style.setProperty("--xp", Math.min(100, S.xp / xpNeed(S.level) * 100));
  const parts = [fmtMult(essMult()) + " эссенции"];
  if (boostActive()) parts.push("⚡ " + fmtTime(S.boostEnds - now()));
  if (S.passes.AutoCatch) parts.push("🤖 авто");
  if (S.passes.VIP) parts.push("👑 VIP");
  $("info").textContent = parts.join(" • ");
  $("gift").classList.toggle("ready", dailyReady());
  $("questDot").style.display = QUESTS.some(questReady) ? "block" : "none";
  const next = ZONES[S.zone];
  if (view > S.zone && next) setBtn($("lockBtn"), "🔓 Открыть за " + fmt(next.price), S.essence >= next.price);
  if (openName) {
    const p = PANELS[openName];
    if (p.sig && p.sig() !== panelSig) renderPanel();
    else if (panelUpdate) panelUpdate();
  }
}
setInterval(refreshHud, 120);

// =====================================================================
// СТАРТ
// =====================================================================
function offlineEarnings() {
  if (!S.lastSeen) return;
  const away = Math.min(8 * 3600, now() - S.lastSeen);
  if (away < 120) return;
  const z = ZONES[S.zone - 1];
  const dps = autoDps() + (S.passes.AutoCatch ? tapDamage() * 2 : 0);
  if (dps <= 0) return;
  const perSec = Math.min(dps / z.hp, 4) * z.value * essMult() * 0.5;
  const gain = Math.floor(perSec * away);
  if (gain <= 0) return;
  S.essence += gain; S.total += gain; save();
  showModal(`<div class="big reveal">🌙</div><h2>С возвращением!</h2>
    <p>Пока вас не было (${fmtLong(away)}), духи-помощники собрали<br><b style="color:var(--gold);font-size:20px">+${fmt(gain)} эссенции</b></p>
    <button class="btn wide gold" data-close>Забрать</button>`, "var(--gold)");
}

resize();
fillZone();
refreshHud();
offlineEarnings();
requestAnimationFrame(frame);
</script>
