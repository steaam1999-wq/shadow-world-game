<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shadow World — прототип</title>
<style>
  :root {
    --bg: #120e1e; --bg2: #1b1530; --panel: #241d3d; --panel2: #2e2650; --accent: #8c5aff;
    --dis: #3d3654; --text: #f3efff; --muted: #a59bc3; --good: #4fd68a; --bad: #ef5470;
    --gold: #ffc94d; --gem: #5fe3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; color: var(--text); overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #241a44 0%, var(--bg) 60%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

  /* ---------- Верхняя панель ---------- */
  #top { display: grid; grid-template-columns: 58px 1fr 76px; align-items: center; gap: 8px; padding: 10px 12px 4px; }
  #lvl {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--accent) calc(var(--xp, 0) * 1%), #2c2446 0);
    box-shadow: 0 0 14px rgba(140, 90, 255, .45);
  }
  #lvl > div {
    width: 42px; height: 42px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center;
    font-weight: 900; font-size: 17px; line-height: 1;
  }
  #lvl small { display: block; font-size: 9px; color: var(--muted); font-weight: 700; }
  #mid { text-align: center; min-width: 0; }
  #ess { font-size: 25px; font-weight: 900; letter-spacing: .3px; white-space: nowrap; transition: transform .12s; }
  #ess.pop { transform: scale(1.08); }
  #info { font-size: 12px; color: var(--muted); margin-top: 2px; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gems {
    justify-self: end; background: var(--panel); border: 1.5px solid rgba(95, 227, 255, .45); border-radius: 12px;
    padding: 6px 8px; font-weight: 900; font-size: 15px; white-space: nowrap;
  }

  /* ---------- Зона ---------- */
  #zonebar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  #zonebar button {
    width: 40px; height: 36px; border-radius: 10px; border: 1.5px solid rgba(140, 90, 255, .5);
    background: var(--panel); color: var(--text); font-size: 16px; font-weight: 900;
  }
  #zonebar button:disabled { opacity: .3; }
  #zname { flex: 1; text-align: center; font-weight: 900; font-size: 16px; text-shadow: 0 0 12px currentColor; }
  #arenaWrap {
    flex: 1; position: relative; margin: 0 10px; border-radius: 18px; overflow: hidden; min-height: 200px;
    border: 1.5px solid rgba(140, 90, 255, .45); box-shadow: 0 0 24px rgba(140, 90, 255, .18), inset 0 0 40px rgba(0, 0, 0, .5);
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #gift {
    position: absolute; right: 10px; top: 10px; width: 46px; height: 46px; border-radius: 14px; border: 0;
    background: rgba(36, 29, 61, .85); font-size: 24px; display: grid; place-items: center;
    box-shadow: 0 0 0 1.5px rgba(255, 201, 77, .5);
  }
  #gift.ready { animation: pulse 1.2s infinite; box-shadow: 0 0 18px rgba(255, 201, 77, .8), 0 0 0 2px var(--gold); }
  #gift .dot, .navdot {
    position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bad); border: 2px solid var(--bg); display: none;
  }
  #gift.ready .dot { display: block; }
  #lock {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 20px; text-align: center; background: rgba(8, 6, 16, .72); font-weight: 700; backdrop-filter: blur(3px);
  }
  #lock .big { font-size: 44px; }
  #hint {
    position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 14px; font-weight: 700;
    color: rgba(243, 239, 255, .85); pointer-events: none; transition: opacity .6s; text-shadow: 0 1px 6px #000;
  }
  #banner {
    position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; opacity: 0;
    font-size: 26px; font-weight: 900; letter-spacing: 1px; color: #ff5a6e; text-shadow: 0 0 18px #ff2040, 0 2px 0 #000;
  }
  #banner.show { animation: banner 2.2s ease forwards; }

  /* ---------- Нижнее меню ---------- */
  #nav { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px 6px 14px; }
  #nav button {
    position: relative; background: linear-gradient(180deg, var(--panel2), var(--panel)); color: var(--text);
    border: 1.5px solid rgba(140, 90, 255, .45); border-radius: 12px; padding: 6px 0 5px; font-size: 10px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  #nav button span { font-size: 19px; }
  #nav button { font-size: 9.5px !important; letter-spacing: -.2px; }
  .heroCard { display: flex; gap: 12px; align-items: center; }
  .heroCard canvas { flex: none; width: 120px; height: 120px; border-radius: 14px;
    background: radial-gradient(circle at 50% 60%, rgba(255, 200, 110, .28), rgba(18, 14, 30, .2) 70%); }
  .heroCard .st { flex: 1; font-size: 13.5px; line-height: 1.55; }
  #nav button:active { transform: scale(.95); }

  /* ---------- Кнопки ---------- */
  .btn {
    background: linear-gradient(180deg, #a07aff, var(--accent)); color: #fff; border: 0; border-radius: 11px;
    font-weight: 900; font-size: 14px; padding: 10px 10px; min-width: 104px; white-space: nowrap;
    box-shadow: 0 3px 0 #5b36b8;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5b36b8; }
  .btn.off { background: var(--dis); color: #b8b0d0; box-shadow: 0 3px 0 #2a2440; }
  .btn.good { background: linear-gradient(180deg, #74f0a8, var(--good)); color: #0d2a1a; box-shadow: 0 3px 0 #2a8a55; }
  .btn.gold { background: linear-gradient(180deg, #ffe08a, var(--gold)); color: #3a2800; box-shadow: 0 3px 0 #b88a1c; }
  .btn.gem { background: linear-gradient(180deg, #9af0ff, var(--gem)); color: #062a33; box-shadow: 0 3px 0 #2aa0bb; }
  .btn.bad { background: linear-gradient(180deg, #ff7d93, var(--bad)); box-shadow: 0 3px 0 #a3283f; }
  .btn.wide { width: 100%; padding: 13px; font-size: 16px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-width: 0; }

  /* ---------- Шторка ---------- */
  #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: none; z-index: 9; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 10;
    background: linear-gradient(180deg, var(--bg2), var(--bg)); border-top: 2px solid var(--accent);
    border-radius: 20px 20px 0 0; max-height: 78%; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .22s ease; box-shadow: 0 -10px 40px rgba(140, 90, 255, .25);
  }
  #sheet.open { transform: none; }
  #sheetHead { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  #sheetTitle { font-size: 20px; font-weight: 900; }
  #sheetClose { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--bad); color: #fff; font-size: 16px; }
  #sheetBody { overflow-y: auto; padding: 0 12px 22px; display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--panel); border-radius: 13px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 255, 255, .04); }
  .row .ic { font-size: 26px; width: 34px; text-align: center; flex: none; }
  .row .t { flex: 1; min-width: 0; }
  .row .n { font-weight: 900; }
  .row .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .row .d b { color: var(--text); }
  .bar { height: 6px; border-radius: 4px; background: #17122a; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #c9a8ff); border-radius: 4px; }
  .card { background: var(--panel); border-radius: 13px; padding: 14px; line-height: 1.55; }
  .card .muted, .muted { color: var(--muted); font-size: 13.5px; }
  .hdr { color: var(--gold); font-weight: 900; margin-top: 6px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pet {
    position: relative; background: var(--panel); border-radius: 12px; padding: 8px 2px 6px; text-align: center;
    border: 2px solid var(--rc, #555); box-shadow: inset 0 0 14px color-mix(in srgb, var(--rc, #555) 35%, transparent);
  }
  .pet .e { font-size: 30px; line-height: 1.1; }
  .pet .b { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .pet .tier { position: absolute; left: 4px; top: 3px; font-size: 9.5px; font-weight: 900; color: var(--rc); }
  .pet.eq::after {
    content: "✓"; position: absolute; right: 3px; top: 1px; font-size: 12px; font-weight: 900; color: #0d2a1a;
    background: var(--good); border-radius: 50%; width: 16px; height: 16px; line-height: 16px;
  }
  .pet.del { animation: wobble .4s infinite; }
  .slots { display: flex; gap: 8px; justify-content: center; margin: 4px 0 2px; }
  .slot {
    width: 54px; height: 54px; border-radius: 14px; border: 2px dashed #4a4170; display: grid; place-items: center; font-size: 28px;
  }
  .slot.f { border-style: solid; border-color: var(--rc); box-shadow: 0 0 12px color-mix(in srgb, var(--rc) 50%, transparent); }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, .05); }
  .stat:last-child { border-bottom: 0; }
  .stat span:last-child { font-weight: 900; text-align: right; }

  /* ---------- Уведомления и оверлеи ---------- */
  #toasts { position: fixed; left: 0; right: 0; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; }
  .toast {
    background: rgba(18, 14, 30, .95); border: 2px solid var(--accent); border-radius: 12px; padding: 8px 14px;
    font-weight: 800; font-size: 14px; max-width: 90%; text-align: center; transition: opacity .4s, transform .4s;
    animation: drop .25s ease;
  }
  #modal {
    position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: rgba(5, 3, 12, .8); backdrop-filter: blur(4px); padding: 24px;
  }
  #modal .box {
    width: 100%; max-width: 360px; background: linear-gradient(180deg, var(--panel2), var(--bg2)); border-radius: 20px;
    padding: 22px 18px 18px; text-align: center; border: 2px solid var(--rc, var(--accent));
    box-shadow: 0 0 40px color-mix(in srgb, var(--rc, var(--accent)) 50%, transparent);
  }
  #modal .big { font-size: 74px; line-height: 1.1; margin: 6px 0; }
  #modal .big.shake { animation: eggshake .9s ease; }
  #modal .big.reveal { animation: reveal .5s ease; }
  #modal h2 { margin: 6px 0 4px; font-size: 22px; }
  #modal p { margin: 4px 0 14px; color: var(--muted); }

  /* --- блики, лучи, анимации появления --- */
  .btn { position: relative; overflow: hidden; }
  .btn.good::after, .btn.gold::after, .btn.gem::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
    animation: shine 3s ease-in-out infinite;
  }
  #sheet.anim #sheetBody > * { animation: rowIn .35s ease both; }
  #modal .box { position: relative; overflow: hidden; }
  #modal .box > *:not(.rays) { position: relative; }
  #modal .rays {
    position: absolute; left: 50%; top: 66px; width: 420px; height: 420px; margin: -210px 0 0 -210px;
    border-radius: 50%; pointer-events: none; animation: spin 8s linear infinite;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 40%, transparent) 0 9deg, transparent 9deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); mask: radial-gradient(circle, #000 15%, transparent 65%);
  }
  #arenaWrap { transition: box-shadow .6s, border-color .6s; }
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none; opacity: .55;
    background: radial-gradient(30% 25% at 20% 30%, rgba(140, 90, 255, .25), transparent 70%),
                radial-gradient(25% 20% at 80% 70%, rgba(95, 227, 255, .15), transparent 70%);
    animation: aurora 18s ease-in-out infinite alternate;
  }
  #ess { text-shadow: 0 0 18px rgba(200, 170, 255, .55); }
  #gems { box-shadow: 0 0 12px rgba(95, 227, 255, .25); }
  /* --- сюжет, цели, колесо --- */
  #lvl { cursor: pointer; }
  #wheelBtn {
    position: absolute; right: 10px; top: 64px; width: 46px; height: 46px; border-radius: 14px; border: 0;
    background: rgba(36, 29, 61, .85); font-size: 24px; display: grid; place-items: center;
    box-shadow: 0 0 0 1.5px rgba(95, 227, 255, .5);
  }
  #wheelBtn .dot { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); border: 2px solid var(--bg); display: none; }
  #wheelBtn.ready { animation: pulse 1.4s infinite; box-shadow: 0 0 16px rgba(95, 227, 255, .8), 0 0 0 2px var(--gem); }
  #wheelBtn.ready .dot { display: block; }
  #objective {
    display: flex; align-items: center; gap: 10px; margin: 8px 10px 0; padding: 7px 10px; border-radius: 14px;
    background: linear-gradient(90deg, rgba(255, 201, 77, .16), rgba(36, 29, 61, .92)); border: 1.5px solid rgba(255, 201, 77, .45);
  }
  #objective .oi { font-size: 22px; }
  #objective .ob { flex: 1; min-width: 0; }
  #oTitle { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #objective .bar { margin-top: 5px; }
  #objective .bar > i { background: linear-gradient(90deg, #ffc94d, #ffe9a8); transition: width .3s; }
  #oBtn { min-width: 84px; padding: 8px; font-size: 13px; }
  #objective.done { animation: glowPulse 1.2s infinite; }
  #dialog {
    position: fixed; inset: 0; z-index: 35; display: none; align-items: flex-end; justify-content: center;
    padding: 0 10px 18px; background: linear-gradient(180deg, transparent 40%, rgba(5, 3, 12, .8));
  }
  #dialog.show { display: flex; }
  .dlg {
    width: 100%; max-width: 540px; display: flex; gap: 12px; align-items: flex-start;
    background: linear-gradient(180deg, #2e2650, #1b1530); border: 2px solid var(--sc, #8c5aff); border-radius: 18px; padding: 14px;
    box-shadow: 0 0 30px color-mix(in srgb, var(--sc, #8c5aff) 45%, transparent); animation: drop .25s ease;
  }
  .portrait {
    flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 36px;
    background: radial-gradient(circle, color-mix(in srgb, var(--sc, #8c5aff) 45%, #1b1530), #120e1e);
    border: 2px solid var(--sc, #8c5aff); box-shadow: 0 0 16px var(--sc, #8c5aff);
  }
  .dlgBody { flex: 1; min-width: 0; }
  .dlgName { font-weight: 900; color: var(--sc, #8c5aff); margin-bottom: 4px; }
  .dlgText { font-size: 15.5px; line-height: 1.45; min-height: 44px; }
  .dlgNext { text-align: right; font-size: 12px; color: var(--muted); margin-top: 6px; animation: blink 1.2s infinite; }
  .shards { display: flex; justify-content: center; gap: 12px; font-size: 32px; margin-bottom: 6px; }
  .shard { color: #3d3654; }
  .shard.got { color: var(--c); text-shadow: 0 0 12px var(--c), 0 0 26px var(--c); }
  .wheelWrap { position: relative; width: 250px; height: 250px; margin: 14px auto 10px; }
  .wheel {
    width: 250px; height: 250px; border-radius: 50%; position: relative; border: 5px solid var(--gold);
    box-shadow: 0 0 30px rgba(255, 201, 77, .5), inset 0 0 22px rgba(0, 0, 0, .45);
  }
  .wheel span {
    position: absolute; left: 50%; top: 50%; width: 70px; margin: -10px 0 0 -35px; text-align: center;
    font-weight: 900; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000;
  }
  .wheel .hub {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: radial-gradient(#fff3c4, var(--gold)); display: grid; place-items: center; color: #5a3d00; font-weight: 900;
    box-shadow: 0 0 12px rgba(0, 0, 0, .5);
  }
  .pointer { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); font-size: 28px; color: var(--gold); z-index: 2; text-shadow: 0 2px 4px #000; }
  #menu { position: fixed; inset: 0; z-index: 45; display: none; flex-direction: column; align-items: center; overflow: hidden; }
  #menu.show { display: flex; animation: fadeIn .35s ease; }
  #menuCv { position: absolute; inset: 0; width: 100%; height: 100%; }
  #menu3d { position: absolute; left: 0; right: 0; top: 21%; height: 48%; width: 100%; display: none; touch-action: none; cursor: grab; }
  #menu.has3d #menu3d { display: block; }
  #rotHint { position: absolute; top: 63%; left: 0; right: 0; text-align: center; font-size: 11.5px; color: rgba(230, 220, 255, .55); font-weight: 700; display: none; pointer-events: none; }
  #menu.has3d #rotHint { display: block; }
  .mTop { position: relative; margin-top: max(6vh, 26px); text-align: center; pointer-events: none; }
  .mTitle {
    font-size: clamp(36px, 11vw, 58px); font-weight: 900; letter-spacing: 3px; line-height: 1;
    background: linear-gradient(180deg, #fff2c9, #ffb347 55%, #d0602a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 170, 70, .55)) drop-shadow(0 3px 0 #2a1406);
  }
  .mSub { margin-top: 8px; color: #d9c9ff; font-weight: 800; letter-spacing: 5px; font-size: 13px; text-transform: uppercase; text-shadow: 0 0 12px rgba(140, 90, 255, .9); }
  .mSkin { position: absolute; top: 68%; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .mSkin button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(36, 29, 61, .85); color: #fff; font-size: 17px; box-shadow: 0 0 0 1.5px rgba(255, 201, 77, .55); }
  #skinName { min-width: 190px; text-align: center; font-weight: 900; font-size: 16px; text-shadow: 0 2px 6px #000; }
  #skinName small { display: block; color: #cfc4ea; font-weight: 700; font-size: 12px; margin-top: 2px; }
  .mBtns { position: absolute; bottom: max(4vh, 18px); left: 0; right: 0; margin: 0 auto; width: min(92%, 420px); display: flex; flex-direction: column; gap: 10px; }
  #playBtn { font-size: 21px; padding: 15px; }
  .mStats { text-align: center; color: #cfc4ea; font-size: 13px; font-weight: 700; text-shadow: 0 1px 4px #000; }
  #menuBtn {
    position: absolute; left: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 12px; border: 0;
    background: rgba(36, 29, 61, .85); color: #fff; font-size: 20px; box-shadow: 0 0 0 1.5px rgba(140, 90, 255, .5);
  }
  #lobby {
    position: absolute; left: 12px; right: 12px; bottom: 64px; padding: 12px; border-radius: 16px; text-align: center; display: none;
    background: rgba(18, 14, 30, .82); border: 1.5px solid rgba(255, 201, 77, .45); backdrop-filter: blur(3px);
  }
  #lobby.show { display: block; animation: drop .3s ease; }
  #lbTitle { font-weight: 900; font-size: 17px; }
  #lbInfo { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; line-height: 1.45; }
  #startRun { font-size: 18px; animation: glowPulse 1.4s infinite; }
  #arenaWrap.running #gift, #arenaWrap.running #wheelBtn, #arenaWrap.running #lobby { display: none; }
  #levelup {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 14px; background: rgba(8, 5, 16, .78); backdrop-filter: blur(2px); z-index: 5;
  }
  #levelup.show { display: flex; animation: fadeIn .2s ease; }
  .luTitle { font-weight: 900; font-size: 17px; color: var(--gold); text-align: center; text-shadow: 0 0 14px rgba(255, 201, 77, .6); }
  .luCards { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; }
  .luCard {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 2px solid var(--cc, #8c5aff); text-align: left;
    background: linear-gradient(180deg, #2e2650, #1b1530); color: var(--text); box-shadow: 0 0 16px color-mix(in srgb, var(--cc, #8c5aff) 35%, transparent);
    animation: rowIn .3s ease both;
  }
  .luCard:active { transform: scale(.97); }
  .luCard .ci { font-size: 34px; width: 46px; text-align: center; flex: none; }
  .luCard .cn { font-weight: 900; font-size: 15.5px; }
  .luCard .cl { font-size: 11.5px; font-weight: 900; color: var(--cc); letter-spacing: .5px; }
  .luCard .cd { font-size: 13px; color: var(--muted); margin-top: 2px; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes glowPulse { 50% { box-shadow: 0 0 18px rgba(255, 201, 77, .65); } }
  @keyframes blink { 50% { opacity: .4; } }
  @keyframes shine { 0% { left: -60%; } 45%, 100% { left: 130%; } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px) scale(.98); } }

const now = () => Date.now() / 1000;
const upCost = (id, lvl) => Math.floor(UPG[id].base * Math.pow(UPG[id].g, lvl));

function petStats(p) {
  const r = RARITY[p.r], tf = 1 + (p.t - 1) * 0.75;
  return { ess: r.ess * tf, dmg: r.dmg * tf };
}
const petPower = p => { const s = petStats(p); return s.ess + s.dmg * 1.5; };
const petInfo = p => PET_POOL[p.r][p.k] || PET_POOL[p.r][0];
function equippedPets() { return S.eq.map(uid => S.pets.find(p => p.uid === uid)).filter(Boolean); }
function petBonus() {
  let ess = 0, dmg = 0;
  for (const p of equippedPets()) { const s = petStats(p); ess += s.ess; dmg += s.dmg; }
  return { ess, dmg };
}
const dmgMultNoPower = () => (1 + petBonus().dmg) * (1 + 0.01 * (S.level - 1));

}

const SUFFIXES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
const trimZeros = t => t.includes(".") ? t.replace(/0+$/, "").replace(/\.$/, "") : t;
function fmt(v) {
  v = Math.floor(v || 0);
  if (Math.abs(v) < 1000) return String(v);
  let i = 0, s = v;
  while (Math.abs(s) >= 1000 && i < SUFFIXES.length - 1) { s /= 1000; i++; }
  const t = Math.abs(s) >= 100 ? s.toFixed(0) : Math.abs(s) >= 10 ? s.toFixed(1) : s.toFixed(2);
  return trimZeros(t) + SUFFIXES[i];
}
const fmtDps = v => v < 10 ? trimZeros(v.toFixed(1)) : fmt(v);
const fmtMult = m => "x" + trimZeros(m.toFixed(2));
const pct = v => "+" + trimZeros((v * 100).toFixed(0)) + "%";
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = n => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}
function fmtLong(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h > 0 ? `${h} ч ${m} мин` : `${m} мин`;
}

    kind, r, hp, max: hp, x: rnd(r + 8, W - r - 8), y: rnd(r + 40, H - r - 60),
    phase: rnd(0, 6.28), blink: rnd(1, 4), flash: 0, sq: 0, spawn: 0.45, dir: 1,

function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function buildBackground() {
  const z = zone(), g = bg, R = seeded(view * 9973 + 7);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgba(z.sky));
  sky.addColorStop(0.45, rgba(mix(z.floor, 0.75)));
  sky.addColorStop(1, rgba(mix(z.floor, 0.45)));
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  // луна / свечение
  const mx = W * 0.78, my = H * 0.12, mr = Math.min(W, H) * 0.09;
  moon = { x: z.fx === "void" ? W / 2 : mx, y: z.fx === "void" ? H * 0.3 : my, r: mr };
  const halo = g.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
  halo.addColorStop(0, rgba(z.glow, 0.35)); halo.addColorStop(1, rgba(z.glow, 0));
  g.fillStyle = halo; g.fillRect(0, 0, W, H);
  if (z.fx !== "void") {
    g.fillStyle = rgba(mix(z.glow, 1.3), 0.85);
    g.beginPath(); g.arc(mx, my, mr, 0, 6.283); g.fill();
    g.fillStyle = rgba(z.sky, 0.55);
    g.beginPath(); g.arc(mx + mr * 0.35, my - mr * 0.15, mr * 0.85, 0, 6.283); g.fill();
  } else {
    for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${R() * 0.7})`; g.fillRect(R() * W, R() * H * 0.7, 1.5, 1.5); }
    const hole = g.createRadialGradient(W / 2, H * 0.3, 2, W / 2, H * 0.3, mr * 2.4);
    hole.addColorStop(0, "rgba(0,0,0,1)"); hole.addColorStop(0.55, rgba(z.glow, 0.5)); hole.addColorStop(1, rgba(z.glow, 0));
    g.fillStyle = hole; g.beginPath(); g.arc(W / 2, H * 0.3, mr * 2.4, 0, 6.283); g.fill();
  }

  const sil = rgba(mix(z.sky, 0.6), 0.95), sil2 = rgba(mix(z.floor, 0.5), 0.9);
  const props = {
    fireflies() {
      for (let layer = 0; layer < 2; layer++) {
        g.fillStyle = layer ? sil2 : sil;
        for (let i = 0; i < 9; i++) {
          const x = R() * W, h = (layer ? 0.18 : 0.26) * H * (0.7 + R() * 0.6), w = h * 0.38, base = H * (layer ? 0.34 : 0.28);
          for (let k = 0; k < 3; k++) {
            g.beginPath(); g.moveTo(x, base - h + k * h * 0.22);
            g.lineTo(x + w * (0.6 + k * 0.2), base - h * 0.35 + k * h * 0.25); g.lineTo(x - w * (0.6 + k * 0.2), base - h * 0.35 + k * h * 0.25);
            g.fill();
          }
          g.fillRect(x - 2, base - h * 0.2, 4, h * 0.25);
        }
      }
    },
    fog() {
      for (let i = 0; i < 6; i++) {
        const x = R() * W, y = H * (0.45 + R() * 0.45), rx = 30 + R() * 50;
        g.fillStyle = rgba(z.glow, 0.10); g.beginPath(); g.ellipse(x, y, rx, rx * 0.3, 0, 0, 6.283); g.fill();
      }
      g.strokeStyle = sil; g.lineWidth = 2;
      for (let i = 0; i < 40; i++) {
        const x = R() * W, y = H * (0.25 + R() * 0.1), h = 20 + R() * 40;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + rnd(-8, 8), y - h / 2, x + rnd(-12, 12), y - h); g.stroke();
      }
    },
    embers() {
      g.fillStyle = sil;
      for (let i = 0; i < 7; i++) {
        const x = R() * W, w = 14 + R() * 14, h = 40 + R() * 70, base = H * 0.3;
        g.fillRect(x, base - h, w, h);
        g.fillRect(x - 4, base - h - 6, w + 8, 6);
        g.beginPath(); g.moveTo(x, base - h - 6); g.lineTo(x + w * 0.5, base - h - 16 * R()); g.lineTo(x + w, base - h - 6); g.fill();
      }
      for (let i = 0; i < 25; i++) { g.fillStyle = rgba(mix(z.floor, 0.6), 0.8); g.beginPath(); g.arc(R() * W, H * (0.4 + R() * 0.6), 2 + R() * 5, 0, 6.283); g.fill(); }
    },
    snow() {
      g.fillStyle = rgba(mix(z.glow, 0.5), 0.55);
      for (let i = 0; i < 14; i++) {
        const x = R() * W, h = 30 + R() * 70, w = 8 + R() * 10, base = H * 0.3;
        g.beginPath(); g.moveTo(x - w, base); g.lineTo(x, base - h); g.lineTo(x + w, base); g.fill();
      }
      for (let i = 0; i < 18; i++) { g.fillStyle = "rgba(230,245,255,0.08)"; g.beginPath(); g.ellipse(R() * W, H * (0.4 + R() * 0.6), 20 + R() * 30, 6, 0, 0, 6.283); g.fill(); }
    },
    void() {
      g.fillStyle = sil;
      for (let i = 0; i < 6; i++) {
        const x = R() * W, y = H * (0.15 + R() * 0.25), s = 10 + R() * 22;
        g.beginPath(); g.moveTo(x - s, y); g.lineTo(x - s * 0.4, y - s * 0.5); g.lineTo(x + s * 0.6, y - s * 0.4); g.lineTo(x + s, y); g.lineTo(x, y + s * 0.9); g.fill();
      }
    },
  };
  props[z.fx]();

  // земля: мягкое пятно света по центру
  const ground = g.createRadialGradient(W / 2, H * 0.68, 10, W / 2, H * 0.68, Math.max(W, H) * 0.6);
  ground.addColorStop(0, rgba(mix(z.floor, 1.35), 0.55)); ground.addColorStop(1, rgba(z.floor, 0));

const hero = { x: 150, y: 300, face: 1, walk: 0, aim: -1.2, recoil: 0, fireT: 0, chase: null };

const keys = new Set();

function muzzle() {

}
function findTarget(range) {

function fireWeapon(target, manual) {

  const c = heroCenter();

function updateHero(dt) {
  let ix = 0, iy = 0;
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
    if (d > 6) { const k = Math.min(1, d / 45); ix = dx / d * k; iy = dy / d * k; }
  }
  if (keys.size) {
    ix = (keys.has("r") ? 1 : 0) - (keys.has("l") ? 1 : 0); iy = (keys.has("d") ? 1 : 0) - (keys.has("u") ? 1 : 0);
    const d = Math.hypot(ix, iy); if (d) { ix /= d; iy /= d; }
  }
  if (ix || iy) hero.chase = null;
  else if (hero.chase) {
    if (!shadows.includes(hero.chase)) hero.chase = null;
    else {
      const c = heroCenter(), dx = hero.chase.x - c.x, dy = hero.chase.y - c.y, d = Math.hypot(dx, dy);
      if (d - hero.chase.r <= heroRange() - 10) { const tg = hero.chase; hero.chase = null; manualShot(tg); }
      else { ix = dx / d; iy = dy / d; }
    }
  }
  const sp = heroSpeed();
  const nx = Math.max(18, Math.min(W - 18, hero.x + ix * sp * dt)), ny = Math.max(95, Math.min(H - 12, hero.y + iy * sp * dt));
  heroDistance += Math.hypot(nx - hero.x, ny - hero.y);
  hero.x = nx; hero.y = ny;
  if (ix || iy) { hero.walk += dt * 9 * Math.min(1, Math.hypot(ix, iy)); if (Math.abs(ix) > 0.15) hero.face = ix > 0 ? 1 : -1; }
  else hero.walk = 0;
  hero.recoil = Math.max(0, hero.recoil - dt);
  vacuumFx = Math.max(0, vacuumFx - dt);

  // автоматическая стрельба по ближайшей тени в радиусе
  if (view <= S.zone && shadows.length && !dialogOpen()) {
    const w = weapon(), interval = 1 / (w.rate * (S.passes.AutoCatch ? 1.6 : 1));
    hero.fireT += dt;
    if (hero.fireT >= interval) {
      const tg = findTarget(heroRange());
      if (tg) { fireWeapon(tg, false); hero.fireT = 0; } else hero.fireT = interval;
    }
  }

  // снаряды
  for (let i = shots.length - 1; i >= 0; i--) {
    const sh = shots[i];
    if (sh.delay > 0) { sh.delay -= dt; continue; }
    sh.life -= dt;
    sh.x += Math.cos(sh.ang) * sh.speed * dt; sh.y += Math.sin(sh.ang) * sh.speed * dt;
    sh.trail.push([sh.x, sh.y]); if (sh.trail.length > 6) sh.trail.shift();
    for (const s of shadows.slice()) {

        burst(sh.x, sh.y, 5, sh.color);

        if (sh.pierce <= 0) break;
      }
    }
    if (sh.pierce <= 0 || sh.life <= 0 || sh.x < -20 || sh.x > W + 20 || sh.y < -20 || sh.y > H + 20) shots.splice(i, 1);
  }

}

let autoTimer = 0, spiritTimer = 0, petSource = 0;

function update(dt) {
  if (run && runPaused()) return;
  const t = performance.now() / 1000;
  S.stats.time += dt;
  if (t - lastTapT > 1.3) combo = 0;

  if (run) runUpdate(dt);
  if (!run) for (const s of shadows) {
    s.phase += dt * 3; s.flash = Math.max(0, s.flash - dt); s.sq = Math.max(0, s.sq - dt); s.spawn = Math.max(0, s.spawn - dt);
    s.blink -= dt; if (s.blink < -0.15) s.blink = rnd(1.5, 4.5);

      const c = heroCenter(), fx = s.x - c.x, fy = s.y - c.y, fd = Math.hypot(fx, fy), fr = s.kind === "gold" ? 110 : 70;

        s.x = Math.max(s.r + 8, Math.min(W - s.r - 8, s.x + fx / fd * push));

    const speed = s.kind === "gold" ? 95 : s.kind === "boss" ? 25 : 42;

    }
  }
  // эффекты
  for (let i = particles.length - 1; i >= 0; i--) {

    if (p.t > p.life) particles.splice(i, 1);

  for (let i = orbs.length - 1; i >= 0; i--) {

    if (o.t >= 0.65) { orbs.splice(i, 1); essPulse = 0.12; }
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    if (!shadows.includes(b.target)) { bolts.splice(i, 1); continue; }
    const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy);
    if (d < b.target.r * 0.6) { bolts.splice(i, 1); if (run) runHit(b.target, autoDps(), "spirit"); continue; }
    const step = 520 * dt; b.x += dx / d * step; b.y += dy / d * step;
    b.trail.push([b.x, b.y]); if (b.trail.length > 8) b.trail.shift();
  }
  for (const a of ambient) a.t += dt;
  const fx = zone().fx;
  for (let i = 0; i < ambient.length; i++) {
    const a = ambient[i];
    if (fx === "void") { a.ang += dt * (40 / a.rad); a.rad -= dt * 14; a.x = a.cx + Math.cos(a.ang) * a.rad; a.y = a.cy + Math.sin(a.ang) * a.rad * 0.6; if (a.rad < 8) ambient[i] = newAmbient(false); continue; }

function rrect(c, x, y, w, h, r) {

function shadeHex(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;

  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

  c.fillStyle = shadeHex(col, -0.32); rrect(c, x, y, w, h, r); c.fill();
  c.save(); rrect(c, x, y, w, h, r); c.clip();
  c.fillStyle = col; c.fillRect(x + w * side, y, w, h);
  const g = c.createLinearGradient(0, y, 0, y + h);

  c.restore();
}

}
function drawRangeAndJoystick() {

function drawBeams() {

const SPEAKERS = { moon: { name: "Дух Луны", emoji: "🌙", color: "#b9a6ff" } };
GUARDIANS.forEach((g, i) => { SPEAKERS["g" + (i + 1)] = { name: g.name, emoji: g.emoji, color: rgba(g.color) }; });
let dlgQueue = [], dlgCurrent = null, dlgTimer = null, dlgChars = [], dlgShown = 0;
const dialogOpen = () => dlgCurrent !== null;

function say(lines, onDone) {
  const copy = lines.map(l => ({ ...l }));
  if (onDone && copy.length) copy[copy.length - 1].onDone = onDone;
  dlgQueue.push(...copy);
  if (!dlgCurrent) nextLine();
}
function nextLine() {
  clearInterval(dlgTimer);
  dlgCurrent = dlgQueue.shift() || null;
  const box = $("dialog");
  if (!dlgCurrent) { box.classList.remove("show"); return; }
  const sp = SPEAKERS[dlgCurrent.who] || SPEAKERS.moon;
  box.classList.add("show");
  box.style.setProperty("--sc", sp.color);
  $("dlgPortrait").textContent = sp.emoji;
  $("dlgName").textContent = sp.name;
  dlgChars = Array.from(dlgCurrent.text); dlgShown = 0; $("dlgText").textContent = "";
  const dlg = box.querySelector(".dlg"); dlg.style.animation = "none"; void dlg.offsetWidth; dlg.style.animation = "";
  dlgTimer = setInterval(() => {
    dlgShown = Math.min(dlgChars.length, dlgShown + 2);
    $("dlgText").textContent = dlgChars.slice(0, dlgShown).join("");
    if (dlgShown >= dlgChars.length) clearInterval(dlgTimer);
  }, 24);
}
$("dialog").addEventListener("click", () => {
  if (!dlgCurrent) return;
  if (dlgShown < dlgChars.length) { clearInterval(dlgTimer); dlgShown = dlgChars.length; $("dlgText").textContent = dlgCurrent.text; return; }
  const done = dlgCurrent.onDone;
  nextLine();
  if (done) done();
});

function checkStory() {
  if (!S.story.prologue) return;
  if (view <= S.zone && !S.story.seen[view]) {
    S.story.seen[view] = true; save();
    say(ZONE_STORY[view - 1].intro);
  }
}

  if (!S.story.prologue) say(PROLOGUE, () => { S.story.prologue = true; save(); checkStory(); });
  else checkStory();
}

function onGuardianDefeated(zi) {
  if (S.shards.includes(zi)) return;
  S.shards.push(zi); save();
  if (view === zi) { buildBackground(); updateZoneBar(); }
  const st = ZONE_STORY[zi - 1], z = ZONES[zi - 1], c = rgba(z.glow);
  say(st.defeat, () => {
    confettiBurst(W / 2, H * 0.35, 80);
    showModal(`<div class="big reveal" style="color:${c};text-shadow:0 0 30px ${c}">✦</div>

function runHit(s, dmg, src) {

  const c = heroCenter();

function wStats(id) {
  const b = RUN_WEAPONS[id], l = run.weapons[id];

  return {
    dmg: tapDamage() * b.dmg * (1 + 0.3 * (l - 1)) * might,
    cd: b.cd * (1 - 0.07 * (l - 1)) * haste,
    range: b.range * (1 + gearStat("range")) + (id === "vacuum" ? 14 * (l - 1) : 0),
    count: (b.count || 1) + Math.floor((l - 1) / 2),
    pierce: (b.pierce || 1) + (id === "crossbow" ? Math.floor((l - 1) / 2) : 0),

}
function nearestEnemies(range, n) {

    .sort((a, b) => a[1] - b[1]).slice(0, n).map(([s]) => s);
}

function runWeapons(dt) {

          }

function runHeroMove(dt) {

    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
    if (d > 6) { const k = Math.min(1, d / 45); ix = dx / d * k; iy = dy / d * k; }
  }
  if (keys.size) {
    ix = (keys.has("r") ? 1 : 0) - (keys.has("l") ? 1 : 0); iy = (keys.has("d") ? 1 : 0) - (keys.has("u") ? 1 : 0);
    const d = Math.hypot(ix, iy); if (d) { ix /= d; iy /= d; }
  }
  const sp = heroSpeed() * (1 + 0.1 * ((run && run.passives.speed) || 0));
  hero.x += ix * sp * dt; hero.y += iy * sp * dt;
  heroDistance += Math.hypot(ix, iy) * sp * dt;
  if (ix || iy) { hero.walk += dt * 9 * Math.min(1, Math.hypot(ix, iy)); if (Math.abs(ix) > 0.15) hero.face = ix > 0 ? 1 : -1; }

  if (S.up[id] >= u.max) return toast("Это улучшение на максимуме", "bad");

let deleteMode = false, heroTab = "weapons";
let openName = null, panelUpdate = null, panelSig = null;
function renderPanel() {
  const p = PANELS[openName], body = $("sheetBody"), scroll = body.scrollTop;
  body.innerHTML = "";
  panelUpdate = p.build(body);
  panelSig = p.sig ? p.sig() : null;
  panelUpdate();
  body.scrollTop = scroll;
}
function openSheet(name) {
  if (openName === name) return closeSheet();
  if (name !== "pets") deleteMode = false;
  openName = name;
  $("sheetTitle").textContent = PANELS[name].title;
  $("sheetBody").scrollTop = 0;
  renderPanel();
  [...$("sheetBody").children].forEach((c, i) => { c.style.animationDelay = `${Math.min(i, 12) * 35}ms`; });
  $("sheet").classList.add("open", "anim");
  clearTimeout(openSheet.animTimer);
  openSheet.animTimer = setTimeout(() => $("sheet").classList.remove("anim"), 800);
  $("shade").style.display = "block";
}
function closeSheet() {
  openName = null; panelUpdate = null; deleteMode = false;
  $("sheet").classList.remove("open");
  $("shade").style.display = "none";
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => openSheet(b.dataset.panel));
$("sheetClose").onclick = closeSheet;
$("shade").onclick = closeSheet;

function refreshHud() {
  $("ess").classList.toggle("pop", essPulse > 0);
  $("gems").textContent = `💎 ${fmt(S.gems)}`;
  $("lvlNum").textContent = S.level;
  $("lvl").style.setProperty("--xp", Math.min(100, S.xp / xpNeed(S.level) * 100));
  const parts = [fmtMult(essMult()) + " эссенции"];
  if (boostActive()) parts.push("⚡ " + fmtTime(S.boostEnds - now()));
  if (S.passes.AutoCatch) parts.push("🤖 авто");
  if (S.passes.VIP) parts.push("👑 VIP");
  $("info").textContent = parts.join(" • ");
  $("gift").classList.toggle("ready", dailyReady());
  $("wheelBtn").classList.toggle("ready", freeSpin());
  const lobbyOn = !run && view <= S.zone;
  $("lobby").classList.toggle("show", lobbyOn);
  if (lobbyOn) {
    const g = GUARDIANS[view - 1], done = S.shards.includes(view);
    $("lbTitle").innerHTML = `${view}. ${zone().name}${done ? " ✦" : ""}`;
    $("lbTitle").style.color = rgba(mix(zone().glow, 1.15));
    $("lbInfo").innerHTML = `Хранитель: <b style="color:var(--text)">${g.emoji} ${g.name}</b>${done ? " — побеждён" : ""} • Рекорд: <b style="color:var(--text)">${fmtTime(S.best[view] || 0)}</b><br>Продержись ${fmtTime(RUN.bossAt)} — и явится Хранитель. Фонарь гаснет: лови тени, чтобы свет не погас!`;
  }
  $("menuBtn").textContent = run ? "⏸" : "☰";
  refreshObjective();
  updateWheelUI();
  $("questDot").style.display = QUESTS.some(questReady) ? "block" : "none";
  const next = ZONES[S.zone];
  if (view > S.zone && next) setBtn($("lockBtn"), "🔓 Открыть за " + fmt(next.price), S.essence >= next.price);
  if (openName) {
    const p = PANELS[openName];
    if (p.sig && p.sig() !== panelSig) renderPanel();
    else if (panelUpdate) panelUpdate();
  }
}
setInterval(refreshHud, 120);

// =====================================================================
// СТАРТ
// =====================================================================
function offlineEarnings() {
  if (!S.lastSeen) return;
  const away = Math.min(8 * 3600, now() - S.lastSeen);
  if (away < 120) return;
  const z = ZONES[S.zone - 1];
  const dps = autoDps() + (S.passes.AutoCatch ? tapDamage() * 2 : 0);
  if (dps <= 0) return;
  const perSec = Math.min(dps / z.hp, 4) * z.value * essMult() * 0.5;
  const gain = Math.floor(perSec * away);
  if (gain <= 0) return;
  S.essence += gain; S.total += gain; save();
  showModal(`<div class="big reveal">🌙</div><h2>С возвращением!</h2>
    <p>Пока вас не было (${fmtLong(away)}), духи-помощники собрали<br><b style="color:var(--gold);font-size:20px">+${fmt(gain)} эссенции</b></p>
    <button class="btn wide gold" data-close>Забрать</button>`, "var(--gold)");
}

resize();
fillZone();
refreshHud();
openMenu();
requestAnimationFrame(frame);
</script>
</body>
