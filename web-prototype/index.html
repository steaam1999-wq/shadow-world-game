<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shadow World — прототип</title>
<style>
  :root {
    --bg: #181426; --panel: #262040; --accent: #8c5aff; --dis: #46405a;
    --text: #f0ebff; --muted: #a59bc3; --good: #5ad28c; --bad: #eb556e; --gold: #ffcd5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }
  #top { padding: 10px 12px 4px; text-align: center; }
  #ess { font-size: 26px; font-weight: 800; }
  #info { font-size: 13px; color: var(--muted); margin-top: 2px; min-height: 17px; }
  #zonebar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  #zonebar button {
    width: 40px; height: 36px; border-radius: 10px; border: 1.5px solid rgba(140,90,255,.5);
    background: var(--panel); color: var(--text); font-size: 18px; font-weight: 800;
  }
  #zonebar button:disabled { opacity: .35; }
  #zname { flex: 1; text-align: center; font-weight: 800; font-size: 16px; }
  #arenaWrap {
    flex: 1; position: relative; margin: 0 10px; border-radius: 16px; overflow: hidden;
    border: 1.5px solid rgba(140,90,255,.5);
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #lock {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; text-align: center;
    background: rgba(10,8,20,.72); font-weight: 700;
  }
  #lock .big { font-size: 40px; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 13px;
    color: rgba(240,235,255,.75); pointer-events: none; transition: opacity .6s;
  }
  #nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px 10px 14px; }
  #nav button {
    background: var(--panel); color: var(--text); border: 1.5px solid rgba(140,90,255,.5);
    border-radius: 12px; padding: 7px 2px; font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  #nav button span { font-size: 20px; }
  .btn {
    background: var(--accent); color: var(--text); border: 0; border-radius: 10px;
    font-weight: 800; font-size: 15px; padding: 10px 12px; min-width: 112px; white-space: nowrap;
  }
  .btn.off { background: var(--dis); color: #cfc8e6; }
  .btn.good { background: var(--good); color: #10261a; }
  .btn.gold { background: var(--gold); color: #2a2008; }
  .btn.bad { background: var(--bad); }
  .btn.wide { width: 100%; padding: 13px; font-size: 17px; }
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 9; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    background: var(--bg); border-top: 2px solid var(--accent); border-radius: 18px 18px 0 0;
    max-height: 74%; display: flex; flex-direction: column; z-index: 10;
    transform: translateY(105%); transition: transform .22s ease;
  }
  #sheet.open { transform: none; }
  #sheetHead { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
  #sheetTitle { font-size: 20px; font-weight: 800; }
  #sheetClose { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--bad); color: #fff; font-size: 16px; }
  #sheetBody { overflow-y: auto; padding: 0 12px 20px; display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--panel); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .row .t { flex: 1; min-width: 0; }
  .row .n { font-weight: 800; }
  .row .d { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .card { background: var(--panel); border-radius: 12px; padding: 14px; line-height: 1.5; }
  .card .muted { color: var(--muted); font-size: 14px; }
  .hdr { color: var(--gold); font-weight: 800; margin-top: 6px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
  #toasts {
    position: fixed; left: 0; right: 0; top: 64px; display: flex; flex-direction: column;
    align-items: center; gap: 6px; pointer-events: none; z-index: 20;
  }
  .toast {
    background: var(--bg); border: 2px solid var(--accent); border-radius: 10px; padding: 8px 14px;
    font-weight: 700; font-size: 14px; max-width: 90%; text-align: center; transition: opacity .4s;
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="ess">🌑 0</div>
    <div id="info"></div>
  </div>
  <div id="zonebar">
    <button id="prevZone" aria-label="Предыдущая зона">◀</button>
    <div id="zname"></div>
    <button id="nextZone" aria-label="Следующая зона">▶</button>
  </div>
  <div id="arenaWrap">
    <canvas id="cv"></canvas>
    <div id="hint">Нажимайте на тени, чтобы ловить их</div>
    <div id="lock">
      <div class="big">🔒</div>
      <div id="lockText"></div>
      <button id="lockBtn" class="btn"></button>
    </div>
  </div>
  <div id="nav">
    <button data-panel="upgrades"><span>⚡</span>Улучшения</button>
    <button data-panel="zones"><span>🗺</span>Зоны</button>
    <button data-panel="rebirth"><span>♻</span>Перерожд.</button>
    <button data-panel="shop"><span>💎</span>Магазин</button>
    <button data-panel="daily"><span>🎁</span>Награда</button>
  </div>
</div>

<div id="shade"></div>
<div id="sheet">
  <div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="Закрыть">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toasts"></div>

<script>
"use strict";
// ================= Баланс (копия src/shared/Config.luau) =================
const ZONES = [
  { name: "Сумеречный лес",  price: 0,      hp: 3,   value: 1,   floor: [46, 58, 52],  shadow: [15, 12, 25], glow: [140, 90, 255] },
  { name: "Туманные болота", price: 500,    hp: 12,  value: 6,   floor: [52, 62, 70],  shadow: [25, 20, 45], glow: [90, 200, 170] },
  { name: "Пепельные руины", price: 5000,   hp: 40,  value: 25,  floor: [70, 52, 45],  shadow: [45, 15, 15], glow: [255, 110, 60] },
  { name: "Ледяной склеп",   price: 50000,  hp: 150, value: 120, floor: [70, 90, 110], shadow: [20, 30, 60], glow: [120, 200, 255] },
  { name: "Бездна",          price: 500000, hp: 600, value: 600, floor: [25, 15, 35],  shadow: [60, 0, 90],  glow: [255, 60, 200] },
];
const UPGRADES = {
  power: { name: "Сила фонаря", desc: "+1 урон по тени за касание", base: 10, growth: 1.45, max: 200 },
  greed: { name: "Жадность", desc: "+10% эссенции за тень", base: 25, growth: 1.55, max: 200 },
};
const REBIRTH = { base: 25000, growth: 3, per: 0.5 };
const DAILY = { cooldown: 20 * 3600, window: 48 * 3600, max: 7, base: 250 };
const PASSES = [
  { key: "DoubleEssence", name: "x2 Эссенция", desc: "Навсегда удваивает всю эссенцию", price: 199 },
  { key: "AutoCatch", name: "Авто-ловля", desc: "Фонарь сам бьёт тени", price: 249 },
  { key: "VIP", name: "Теневой VIP", desc: "+50% эссенции (в Roblox ещё +скорость)", price: 299 },
];
const PRODUCTS = [
  { key: "Boost", kind: "boost", name: "Буст x2 на 15 минут", duration: 900, price: 49 },
  { key: "EssenceSmall", kind: "essence", name: "Горсть эссенции", amount: 500, price: 25 },
  { key: "EssenceMedium", kind: "essence", name: "Сосуд эссенции", amount: 5000, price: 99 },
  { key: "EssenceLarge", kind: "essence", name: "Сундук эссенции", amount: 50000, price: 399 },
];
const SHADOWS_PER_ZONE = 8, RESPAWN_TIME = 3, CLICK_COOLDOWN = 0.12, AUTO_INTERVAL = 0.5;

// ================= Сохранение =================
const SAVE_KEY = "shadowworld_proto_v1";
const fresh = () => ({
  essence: 0, total: 0, rebirths: 0, up: { power: 0, greed: 0 }, zone: 1,
  lastDaily: 0, streak: 0, boostEnds: 0, passes: {},
});
let S = fresh();
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const d = JSON.parse(raw);
    S = Object.assign(fresh(), d);
    S.up = Object.assign(fresh().up, d.up || {});
    S.passes = d.passes || {};
  }
} catch (e) { /* хранилище недоступно — играем без сохранения */ }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
setInterval(save, 2000);

// ================= Формулы =================
const now = () => Date.now() / 1000;
const upCost = (id, lvl) => Math.floor(UPGRADES[id].base * Math.pow(UPGRADES[id].growth, lvl));
const damage = () => 1 + S.up.power;
const rebirthCost = r => Math.floor(REBIRTH.base * Math.pow(REBIRTH.growth, r));
const rebirthMult = r => 1 + REBIRTH.per * r;
function multiplier() {
  let m = (1 + 0.1 * S.up.greed) * rebirthMult(S.rebirths);
  if (S.passes.DoubleEssence) m *= 2;
  if (S.passes.VIP) m *= 1.5;
  if (S.boostEnds > now()) m *= 2;
  return m;
}
const nextStreak = () => (S.lastDaily > 0 && now() - S.lastDaily <= DAILY.window) ? Math.min(S.streak + 1, DAILY.max) : 1;
const dailyReward = st => Math.floor(DAILY.base * st * ZONES[S.zone - 1].value * rebirthMult(S.rebirths));
const packAmount = p => Math.floor(p.amount * ZONES[S.zone - 1].value * rebirthMult(S.rebirths));

// ================= Форматирование =================
const SUFFIXES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
function trimZeros(t) { return t.includes(".") ? t.replace(/0+$/, "").replace(/\.$/, "") : t; }
function fmt(v) {
  v = Math.floor(v || 0);
  if (Math.abs(v) < 1000) return String(v);
  let i = 0, s = v;
  while (Math.abs(s) >= 1000 && i < SUFFIXES.length - 1) { s /= 1000; i++; }
  const t = Math.abs(s) >= 100 ? s.toFixed(0) : Math.abs(s) >= 10 ? s.toFixed(1) : s.toFixed(2);
  return trimZeros(t) + SUFFIXES[i];
}
const fmtMult = m => "x" + trimZeros(m.toFixed(2));
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}

// ================= Уведомления =================
const $ = id => document.getElementById(id);
function toast(text, kind) {
  const el = document.createElement("div");
  el.className = "toast";
  el.style.borderColor = kind === "good" ? "var(--good)" : kind === "bad" ? "var(--bad)" : "var(--accent)";
  el.textContent = text;
  $("toasts").append(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 400); }, 2600);
}

// ================= Арена =================
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 300, H = 300;
let view = S.zone; // какая зона сейчас на экране
let shadows = [], respawns = [], particles = [], floats = [], decor = [];
const rnd = (a, b) => a + Math.random() * (b - a);
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const scale = (c, k) => c.map(v => Math.min(255, v * k));

function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(100, r.width); H = Math.max(100, r.height);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const s of shadows) { s.x = Math.min(s.x, W - s.r); s.y = Math.min(s.y, H - s.r); pickTarget(s); }
  makeDecor();
}
window.addEventListener("resize", resize);

const shadowRadius = z => Math.min(W, H) * 0.07 * (1 + (z - 1) * 0.12);
function newShadow() {
  const z = ZONES[view - 1], r = shadowRadius(view);
  const s = { x: rnd(r + 6, W - r - 6), y: rnd(r + 20, H - r - 6), r, hp: z.hp, max: z.hp, phase: rnd(0, 6.28), flash: 0, spawn: 0.4 };
  pickTarget(s);
  return s;
}
function pickTarget(s) {
  s.tx = Math.min(W - s.r - 6, Math.max(s.r + 6, s.x + rnd(-90, 90)));
  s.ty = Math.min(H - s.r - 6, Math.max(s.r + 20, s.y + rnd(-90, 90)));
  s.wait = rnd(0.3, 1.6);
}
function makeDecor() {
  decor = [];
  for (let i = 0; i < 7; i++) decor.push({ x: rnd(20, W - 20), y: rnd(20, H - 20), r: rnd(5, 9), a: rnd(0, 1.5) });
}
function fillZone() {
  shadows = []; respawns = []; particles = []; floats = [];
  if (view <= S.zone) for (let i = 0; i < SHADOWS_PER_ZONE; i++) shadows.push(newShadow());
  makeDecor();
  updateZoneBar();
}

function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), sp = rnd(40, 160);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: rnd(0.3, 0.6), color });
  }
}

let lastHit = 0, hintShown = true;
function hit(s, auto) {
  if (view > S.zone || !shadows.includes(s)) return;
  const t = performance.now() / 1000;
  if (!auto) {
    if (t - lastHit < CLICK_COOLDOWN) return;
    lastHit = t;
    if (hintShown) { hintShown = false; $("hint").style.opacity = "0"; }
  }
  const z = ZONES[view - 1];
  s.hp -= damage();
  s.flash = 0.12;
  burst(s.x, s.y, 4, z.glow);
  if (s.hp <= 0) {
    const gain = Math.floor(Math.max(1, z.value * multiplier()));
    S.essence += gain; S.total += gain;
    floats.push({ x: s.x, y: s.y - s.r, text: "+" + fmt(gain), t: 0 });
    burst(s.x, s.y, 16, z.glow);
    shadows.splice(shadows.indexOf(s), 1);
    respawns.push(RESPAWN_TIME);
  }
}

cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bestD = Infinity;
  for (const s of shadows) {
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < s.r + 16 && d < bestD) { best = s; bestD = d; }
  }
  if (best) hit(best, false);
});

let autoTimer = 0;
function update(dt) {
  for (const s of shadows) {
    s.phase += dt * 3;
    s.flash = Math.max(0, s.flash - dt);
    s.spawn = Math.max(0, s.spawn - dt);
    if (s.wait > 0) { s.wait -= dt; continue; }
    const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
    if (d < 2) { pickTarget(s); continue; }
    const step = Math.min(d, 40 * dt);
    s.x += dx / d * step; s.y += dy / d * step;
  }
  for (let i = respawns.length - 1; i >= 0; i--) {
    respawns[i] -= dt;
    if (respawns[i] <= 0) { respawns.splice(i, 1); shadows.push(newShadow()); }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
    if (p.t > p.life) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt; f.y -= 45 * dt;
    if (f.t > 0.9) floats.splice(i, 1);
  }
  if (S.passes.AutoCatch && view <= S.zone && shadows.length) {
    autoTimer += dt;
    if (autoTimer >= AUTO_INTERVAL) {
      autoTimer = 0;
      // бьём самую «раненую» тень, чтобы авто-ловля добивала
      let target = shadows[0];
      for (const s of shadows) if (s.hp < target.hp) target = s;
      hit(target, true);
    }
  }
}

function draw() {
  const z = ZONES[view - 1];
  const bg = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H) * 0.75);
  bg.addColorStop(0, rgba(scale(z.floor, 1.15)));
  bg.addColorStop(1, rgba(scale(z.floor, 0.3)));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (const d of decor) {
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 4);
    g.addColorStop(0, rgba(z.glow, 0.28)); g.addColorStop(1, rgba(z.glow, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 4, 0, 6.283); ctx.fill();
    // светящийся кристалл (не путать с тенью)
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a);
    ctx.fillStyle = rgba(z.glow, 0.35);
    ctx.beginPath(); ctx.moveTo(0, -d.r * 1.6); ctx.lineTo(d.r * 0.7, 0); ctx.lineTo(0, d.r * 1.6); ctx.lineTo(-d.r * 0.7, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  for (const s of shadows) {
    const k = (1 + Math.sin(s.phase) * 0.05) * (s.flash > 0 ? 1.12 : 1) * (1 - s.spawn / 0.4 * 0.8);
    const r = s.r * k;
    const glow = ctx.createRadialGradient(s.x, s.y, r * 0.5, s.x, s.y, r * 1.9);
    glow.addColorStop(0, rgba(z.glow, 0.5)); glow.addColorStop(1, rgba(z.glow, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.9, 0, 6.283); ctx.fill();

    const body = ctx.createRadialGradient(s.x - r * 0.3, s.y - r * 0.35, r * 0.1, s.x, s.y, r);
    body.addColorStop(0, rgba(s.flash > 0 ? [255, 255, 255] : scale(z.shadow, 2.4)));
    body.addColorStop(1, rgba(z.shadow));
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.283); ctx.fill();

    ctx.fillStyle = rgba(z.glow);
    for (const ex of [-0.33, 0.33]) {
      ctx.beginPath(); ctx.ellipse(s.x + ex * r, s.y - r * 0.12, r * 0.15, r * 0.24, 0, 0, 6.283); ctx.fill();
    }

    if (s.hp < s.max) {
      const w = s.r * 2, y = s.y - s.r - 12;
      ctx.fillStyle = "rgba(20,15,30,.85)"; ctx.fillRect(s.x - w / 2, y, w, 6);
      ctx.fillStyle = rgba(z.glow); ctx.fillRect(s.x - w / 2, y, w * Math.max(0, s.hp / s.max), 6);
    }
  }

  for (const p of particles) {
    ctx.fillStyle = rgba(p.color, 1 - p.t / p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, 6.283); ctx.fill();
  }

  ctx.textAlign = "center"; ctx.font = "800 20px system-ui, sans-serif";
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 0.9);
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = "#ffcd5a"; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

let lastFrame = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastFrame) / 1000);
  lastFrame = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

// ================= Зоны: переключение =================
function updateZoneBar() {
  const z = ZONES[view - 1];
  $("zname").textContent = `${view}. ${z.name}`;
  $("zname").style.color = rgba(z.glow);
  $("prevZone").disabled = view <= 1;
  $("nextZone").disabled = view >= Math.min(S.zone + 1, ZONES.length);
  const locked = view > S.zone;
  $("lock").style.display = locked ? "flex" : "none";
  if (locked) $("lockText").textContent = `«${z.name}» закрыта. Тени здесь дают ${fmt(z.value)} эссенции (базово).`;
}
$("prevZone").onclick = () => { if (view > 1) { view--; fillZone(); } };
$("nextZone").onclick = () => { if (view < Math.min(S.zone + 1, ZONES.length)) { view++; fillZone(); } };
$("lockBtn").onclick = buyZone;

// ================= Действия =================
function buyUpgrade(id) {
  const u = UPGRADES[id], lvl = S.up[id];
  if (lvl >= u.max) return toast("Это улучшение уже на максимуме", "bad");
  const cost = upCost(id, lvl);
  if (S.essence < cost) return toast("Не хватает эссенции", "bad");
  S.essence -= cost; S.up[id] = lvl + 1; save();
}
function buyZone() {
  const next = ZONES[S.zone];
  if (!next) return toast("Все зоны уже открыты!");
  if (S.essence < next.price) return toast("Не хватает эссенции", "bad");
  S.essence -= next.price; S.zone++; view = S.zone; save();
  fillZone();
  toast(`Открыта зона «${next.name}»!`, "good");
}
function doRebirth() {
  const cost = rebirthCost(S.rebirths);
  if (S.essence < cost) return toast(`Для перерождения нужно ${fmt(cost)} эссенции`, "bad");
  S.rebirths++; S.essence = 0; S.zone = 1; S.up = { power: 0, greed: 0 }; view = 1; save();
  fillZone();
  toast(`Перерождение! Множитель теперь ${fmtMult(rebirthMult(S.rebirths))}`, "good");
}
function claimDaily() {
  const left = DAILY.cooldown - (now() - S.lastDaily);
  if (S.lastDaily > 0 && left > 0) return toast("Награда будет через " + fmtTime(left), "bad");
  const st = nextStreak(), reward = dailyReward(st);
  S.streak = st; S.lastDaily = now(); S.essence += reward; S.total += reward; save();
  toast(`День ${st}: +${fmt(reward)} эссенции!`, "good");
}
function demoPass(p) {
  S.passes[p.key] = true; save();
  toast(`Демо-покупка: ${p.name} (в Roblox — ${p.price} R$)`, "good");
}
function demoProduct(p) {
  if (p.kind === "boost") {
    S.boostEnds = Math.max(S.boostEnds, now()) + p.duration;
    toast(`Демо: буст x2 активирован (в Roblox — ${p.price} R$)`, "good");
  } else {
    const a = packAmount(p);
    S.essence += a; S.total += a;
    toast(`Демо: +${fmt(a)} эссенции (в Roblox — ${p.price} R$)`, "good");
  }
  save();
}

// ================= Панели =================
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function row(name, desc) {
  const r = el("div", "row"), t = el("div", "t"), n = el("div", "n", name), d = el("div", "d", desc), b = el("button", "btn");
  t.append(n, d); r.append(t, b);
  return { r, n, d, b };
}
function setBtn(b, text, enabled, cls) {
  b.textContent = text;
  b.className = "btn" + (b.classList.contains("wide") ? " wide" : "") + (enabled ? (cls ? " " + cls : "") : " off");
}
// Двойное нажатие для опасных действий
function confirmable(btn, action, getText) {
  let until = 0;
  btn.onclick = () => {
    if (Date.now() < until) { until = 0; action(); }
    else { until = Date.now() + 3000; btn.textContent = "Точно? Нажмите ещё раз"; }
  };
  return () => Date.now() < until;
}

const PANELS = {
  upgrades: {
    title: "⚡ Улучшения",
    build(body) {
      const refs = {};
      for (const id of Object.keys(UPGRADES)) {
        const u = UPGRADES[id], x = row(u.name, u.desc);
        x.b.onclick = () => buyUpgrade(id);
        refs[id] = x; body.append(x.r);
      }
      body.append(el("div", "note", "В Roblox-версии есть ещё «Теневой шаг» — скорость бега персонажа."));
      return () => {
        for (const id in refs) {
          const u = UPGRADES[id], lvl = S.up[id], x = refs[id];
          x.n.textContent = `${u.name} • ур. ${lvl}`;
          if (lvl >= u.max) setBtn(x.b, "МАКС", false);
          else { const c = upCost(id, lvl); setBtn(x.b, "🌑 " + fmt(c), S.essence >= c); }
        }
      };
    },
  },
  zones: {
    title: "🗺 Зоны",
    build(body) {
      const refs = ZONES.map((z, i) => {
        const x = row(z.name, `Тень: ${fmt(z.hp)} ОЗ • награда ${fmt(z.value)}`);
        x.n.style.color = rgba(z.glow);
        x.b.onclick = () => {
          const idx = i + 1;
          if (idx <= S.zone) { view = idx; fillZone(); closeSheet(); }
          else if (idx === S.zone + 1) buyZone();
        };
        body.append(x.r);
        return x;
      });
      return () => refs.forEach((x, i) => {
        const idx = i + 1, z = ZONES[i];
        if (idx <= S.zone) setBtn(x.b, idx === view ? "Вы здесь" : "Перейти", idx !== view, "good");
        else if (idx === S.zone + 1) setBtn(x.b, "🔓 " + fmt(z.price), S.essence >= z.price);
        else setBtn(x.b, "🔒", false);
      });
    },
  },
  rebirth: {
    title: "♻ Перерождение",
    build(body) {
      const card = el("div", "card"), btn = el("button", "btn wide");
      body.append(card, btn);
      const pending = confirmable(btn, doRebirth);
      const resetBtn = el("button", "btn wide bad");
      const resetPending = confirmable(resetBtn, () => {
        S = fresh(); view = 1; save(); fillZone(); toast("Прогресс прототипа сброшен");
      });
      body.append(el("div", "hdr", "Для тестирования"), resetBtn);
      return () => {
        const c = rebirthCost(S.rebirths);
        card.innerHTML = "";
        card.append(
          el("div", null, `Перерождений: ${S.rebirths}`),
          el("div", null, `Множитель: ${fmtMult(rebirthMult(S.rebirths))} → ${fmtMult(rebirthMult(S.rebirths + 1))}`),
          el("div", "muted", "Сбросит эссенцию, улучшения и зоны, но навсегда увеличит доход."),
        );
        if (!pending()) setBtn(btn, `Переродиться • 🌑 ${fmt(c)}`, S.essence >= c, "gold");
        if (!resetPending()) setBtn(resetBtn, "Сбросить весь прогресс", true, "bad");
      };
    },
  },
  shop: {
    title: "💎 Магазин",
    build(body) {
      body.append(el("div", "note", "Это прототип: покупки здесь бесплатные и нужны, чтобы почувствовать бонусы. В Roblox они стоят Robux."));
      body.append(el("div", "hdr", "Навсегда (Game Pass)"));
      const passRefs = PASSES.map(p => {
        const x = row(p.name, p.desc);
        x.b.onclick = () => { if (!S.passes[p.key]) demoPass(p); };
        body.append(x.r);
        return [p, x];
      });
      body.append(el("div", "hdr", "Разовые покупки"));
      const prodRefs = PRODUCTS.map(p => {
        const x = row(p.name, "");
        x.b.onclick = () => demoProduct(p);
        body.append(x.r);
        return [p, x];
      });
      const undo = el("button", "btn wide");
      undo.onclick = () => { S.passes = {}; save(); toast("Демо-пропуска отключены"); };
      body.append(undo);
      return () => {
        for (const [p, x] of passRefs) setBtn(x.b, S.passes[p.key] ? "✓ Куплено" : `R$ ${p.price}`, !S.passes[p.key], "good");
        for (const [p, x] of prodRefs) {
          x.d.textContent = p.kind === "boost" ? "Удваивает эссенцию, время складывается" : `+${fmt(packAmount(p))} эссенции`;
          setBtn(x.b, `R$ ${p.price}`, true, "good");
        }
        setBtn(undo, "Отключить демо-пропуска", Object.keys(S.passes).length > 0);
      };
    },
  },
  daily: {
    title: "🎁 Ежедневная награда",
    build(body) {
      const card = el("div", "card"), btn = el("button", "btn wide");
      btn.onclick = claimDaily;
      body.append(card, btn);
      return () => {
        const st = nextStreak(), left = DAILY.cooldown - (now() - S.lastDaily);
        card.innerHTML = "";
        card.append(
          el("div", null, `Серия: ${S.streak} / ${DAILY.max} дней`),
          el("div", null, `Награда: 🌑 ${fmt(dailyReward(st))}`),
          el("div", "muted", "Заходите каждый день — награда растёт. Пропуск больше 2 дней сбросит серию."),
        );
        if (S.lastDaily === 0 || left <= 0) setBtn(btn, "Забрать!", true, "good");
        else setBtn(btn, "Через " + fmtTime(left), false);
      };
    },
  },
};

let openName = null, panelUpdate = null;
function openSheet(name) {
  if (openName === name) return closeSheet();
  const p = PANELS[name];
  openName = name;
  $("sheetTitle").textContent = p.title;
  const body = $("sheetBody");
  body.innerHTML = ""; body.scrollTop = 0;
  panelUpdate = p.build(body);
  panelUpdate();
  $("sheet").classList.add("open");
  $("shade").style.display = "block";
}
function closeSheet() {
  openName = null; panelUpdate = null;
  $("sheet").classList.remove("open");
  $("shade").style.display = "none";
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => openSheet(b.dataset.panel));
$("sheetClose").onclick = closeSheet;
$("shade").onclick = closeSheet;

// ================= HUD =================
function refreshHud() {
  $("ess").textContent = `🌑 ${fmt(S.essence)} эссенции`;
  const parts = [`Множитель ${fmtMult(multiplier())}`, `Перерождений: ${S.rebirths}`];
  if (S.boostEnds > now()) parts.push("⚡ Буст " + fmtTime(S.boostEnds - now()));
  if (S.passes.AutoCatch) parts.push("🤖 Авто");
  $("info").textContent = parts.join(" • ");
  const next = ZONES[S.zone];
  if (view > S.zone && next) setBtn($("lockBtn"), "🔓 Открыть за " + fmt(next.price), S.essence >= next.price);
  if (panelUpdate) panelUpdate();
}
setInterval(refreshHud, 150);

// ================= Старт =================
view = Math.min(Math.max(1, S.zone), ZONES.length);
resize();
fillZone();
refreshHud();
requestAnimationFrame(frame);
</script>
</body>
