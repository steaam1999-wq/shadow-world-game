// Komeeta для Android: Trusted Web Activity — приложение открывает komeeta.com во весь экран через Chrome.
// Вход через Google/Telegram, камера, микрофон, звонки и уведомления работают так же, как на сайте.
plugins { id 'com.android.application' }

android {
    namespace 'com.komeeta.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.komeeta.app'
        minSdk 23
        targetSdk 34
        versionCode (project.findProperty('versionCode') ?: '1').toInteger()
        versionName "1.0.${project.findProperty('versionCode') ?: '1'}"
    }
    signingConfigs {
        release {
            def ks = System.getenv('KOMEETA_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KOMEETA_KEY_PASSWORD')
                keyAlias 'komeeta'
                keyPassword System.getenv('KOMEETA_KEY_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
