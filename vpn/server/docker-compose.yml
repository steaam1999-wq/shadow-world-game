services:
  vpn:
    build: .
    container_name: shadowvpn-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    env_file: .env
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      # Веб-панель. По умолчанию доступна только с самого сервера (через SSH-туннель).
      # Чтобы открыть её из интернета, замените 127.0.0.1 на 0.0.0.0 и поставьте HTTPS-прокси.
      - "${WEB_LISTEN:-127.0.0.1}:${WEB_PORT:-51821}:51821/tcp"
    volumes:
      - ./data:/config
