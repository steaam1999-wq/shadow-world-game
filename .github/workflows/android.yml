# Komeeta для Android: своё приложение (Capacitor + WebView), Chrome не нужен.
# Собирает APK и выкладывает его в «Releases» репозитория.
# Секреты репозитория:
#   ANDROID_KEY_PASSWORD — пароль ключа подписи (ключ лежит в mobile/android/komeeta-release.p12; не менять, иначе обновления не встанут);
#   GOOGLE_SERVICES_JSON — содержимое google-services.json из Firebase (нужен для push-уведомлений; без него приложение соберётся, но без пушей).
name: Android APK

on:
  push:
    branches: [claude/iskra-site, main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Зависимости и синхронизация Capacitor
        working-directory: mobile
        run: |
          npm ci || npm install --no-audit --no-fund
          npx cap sync android

      - name: Firebase (push-уведомления)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > mobile/android/app/google-services.json; echo "google-services.json: есть"; else echo "::warning::Нет секрета GOOGLE_SERVICES_JSON — APK без push-уведомлений"; fi

      - name: Сборка APK
        env:
          KOMEETA_KEYSTORE: ${{ github.workspace }}/mobile/android/komeeta-release.p12
          KOMEETA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          if [ -z "$KOMEETA_KEY_PASSWORD" ]; then echo "::error::Нет секрета ANDROID_KEY_PASSWORD"; exit 1; fi
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=$((100 + ${{ github.run_number }})) --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../komeeta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: komeeta-apk
          path: komeeta.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Komeeta для Android 2.0.${{ github.run_number }}
          body: |
            Своё приложение Komeeta — Chrome не нужен.
            Установка: скачайте komeeta.apk на телефон и откройте его (разрешите установку из этого источника).
          files: komeeta.apk
          make_latest: true
